      operationId: adminRunLeaveAccrual
      summary: "Trigger `LeaveAccrualJob` (`PKG_LEAVE.process_monthly_accrual` / `run_monthly_accrual`)"
      description: |
        Runs asynchronously; `202` with the job id. Idempotent through `leave_accrual_log`
        (`(empId, leaveTypeId, accrualDate, 'ACCRUAL')` unique) – a re-run for the same
        `accrualDate` reports every row as `skipped`. `-20702` when a run for the same
        `accrualDate` is still `RUNNING`. Request body = P2 `AccrualRunRequest`. Poll
        `GET /api/admin/leave/jobs/{jobId}`.
      x-preauthorize: hasAuthority('LEAVE:ADMIN')
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccrualRunRequest' }
      responses:
        '202':
          description: Accepted
          headers:
            Location: { schema: { type: string }, description: "`/api/admin/leave/jobs/{jobId}`" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchRunResult' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/JobAlreadyRunning'
  /api/admin/leave/carryover:
    post:
      tags: [admin-leave-jobs]
      operationId: adminRunLeaveCarryover
      summary: "Trigger `LeaveCarryoverJob` (`PKG_LEAVE.process_carryover(p_year)`)"
      description: |
        Creates the `year + 1` balance rows with `carryoverFromPrev = LEAST(available,
        carryoverMax)` where `available` **subtracts `pending`** (VAL-05, consistent with
        the report). Idempotent through `leave_accrual_log` `'CARRYOVER'`. `-20702` when
        a carryover for the same `year` is `RUNNING`. Request body = P2
        `CarryoverRunRequest`.
      x-preauthorize: hasAuthority('LEAVE:ADMIN')
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarryoverRunRequest' }
      responses:
        '202':
          description: Accepted
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchRunResult' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/JobAlreadyRunning'
  /api/admin/leave/jobs/{jobId}:
