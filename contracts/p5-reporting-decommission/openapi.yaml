openapi: 3.1.0
info:
  title: HRMS Phase 5 – Reporting / Integration, reference-data ownership, Forms + Oracle decommission
  version: 5.0.0-contract
  description: |
    Frozen API surface for Phase 5 (CUTOVER_PLAN.md §9, COMPONENT_MAPPING.md §9 rows
    `PKG_REPORTING` / `PKG_INTEGRATION`, MODERNIZATION_BLUEPRINT.md §8 Reporting row,
    TEST_STRATEGY.md §5 row 5). Written BEFORE any implementation exists; the backend
    node implements exactly this file, the frontend node codes against it.

    Target architecture (non-negotiable, MODERNIZATION_BLUEPRINT.md §9 decisions A/B):
    * Spring Boot (Java 21) on PostgreSQL + React. **No PL/SQL, PL/pgSQL, triggers or
      .pll in the target.** `PKG_REPORTING`, `PKG_INTEGRATION`, the six `VW_*` views and
      `HRMS_ADMIN.fmb` / `HRMS_REPORTS.fmb` are read-only characterization references
      (GOLDEN-ORACLE MODE = OFF: no Oracle runtime exists; expectations are recorded
      fixtures, `legacy_source=recorded`).
    * Three Java modules are introduced (ARCH-01/02, one owner per table):
      - `reporting-module` – **owns no table**. Every report is a read-only Spring Data
        JDBC projection (plain SQL, `WITH RECURSIVE` for the hierarchy) over tables owned
        by the P0–P4 modules, executed on the PostgreSQL read replica when one exists.
        The six `VW_*` views are **not** recreated on PostgreSQL; the report SQL is the
        `tests/reconciliation/pg/*.sql` transcription (Level 3 pins it).
      - `admin-module` – owns `DEPARTMENTS`, `LOCATIONS`, `JOB_GRADES`, `JOB_TITLES`,
        `LEAVE_TYPES`, `SYSTEM_PARAMETERS`, `HOLIDAYS`, `AUDIT_LOG` (**ownership of the
        reference tables transfers here from `reference-module` (P0 read-only) – P0's
        `/api/reference/*` GET routes are kept, served by the same repositories**).
      - `integration-module` – owns `INTEGRATION_LOG` (new, PostgreSQL only) and
        `integration_files` (new; feed metadata + object-storage key). It reads payroll /
        employee / benefits data through the owning modules' Java service interfaces.
    * Identity comes from the P0 JWT (`sub` = `user_accounts.user_id` as a string, `empId`,
      `authorities[]`; there is **no** `username` claim). No route takes an actor `empId`
      or `p_user`; `createdBy` / `modifiedBy` / `changedBy` / `startedBy` /
      `INTEGRATION_LOG.created_by` are always `jwt.sub` (`CurrentCaller.userId()`, as in
      P3); `jwt.empId` is used only for subject scoping (`mine=true`, manager inbox,
      employee lookup). Route `{empId}` never appears in this module.
    * Every failure body is `ApiError {code, message, field?, traceId}`; `code` is the
      legacy `-20xxx` number as a string (see `error-codes.md`) or a framework code.
    * Validation lives once in `hrms-validation` (`dto/admin/*`, `dto/reporting/*`,
      `dto/integration/*`) and is exported to
      `frontend/src/generated/validation-schema.json`, module `p5-reporting-decommission`.
    * Reference-data list responses are **unpaged arrays** (the admin grids are ≤ a few
      hundred rows); audit-log search and every report are paged (`page`, `size`, Spring
      `Page` envelope) in JSON and **streamed unpaged** as CSV.

    Reports – JSON + CSV (mirroring the six `VW_*` views, TEST_STRATEGY.md §5 row 0/5):
    * Each `GET /api/reports/{name}` supports content negotiation: `Accept:
      application/json` (default) → `Page<Row>`; `Accept: text/csv` **or** the `.csv`
      path suffix (`GET /api/reports/{name}.csv`) → `text/csv; charset=utf-8`, RFC 4180,
      header row = the JSON property names in the order documented per row schema,
      `Content-Disposition: attachment; filename="{name}-{asOf}.csv"`, no paging (all
      rows), numbers unformatted (`Money` two decimals, `Rate` four), dates ISO-8601,
      `null` → empty field. Filters are identical in both representations.
    * `asOf` (`YYYY-MM-DD`, default today) replaces every `SYSDATE` in the views
      (`TENURE_YEARS`, `YEARS_IN_GRADE`, `EXTRACT(YEAR FROM SYSDATE)`, `DAYS_PENDING`).
      `TENURE_YEARS` / `YEARS_IN_GRADE` reproduce Oracle `MONTHS_BETWEEN` (day-of-month
      fraction, `tests/golden/README.md`).
    * `PKG_REPORTING` ref-cursor procedures (`headcount_report`, `compensation_summary`,
      `turnover_report`, `new_hires_report`, `leave_utilization_report`,
      `payroll_summary_report`, `eeo_compliance_report`) are **folded into the six report
      routes as filters/aggregates**: their filters (`deptId`, `locationCode`, `gradeId`,
      `asOf`, `year`, `periodId`, `from`/`to`) are query parameters here; the aggregate
      shapes (`compensation_summary` per department, `eeo_compliance_report`) are the
      `summary` blocks of the corresponding routes. `refresh_reporting_tables` is a
      legacy no-op and has no target route.
    * **VAL-05 (frozen here):** `leave-summary.available` =
      `openingBalance + accrued - used + adjustment - pending`, i.e. **the target
      subtracts `PENDING`** exactly like `PKG_LEAVE` / `leave_balances.available`. The
      legacy `VW_LEAVE_SUMMARY.AVAILABLE` omits `- PENDING`; the resulting per-row offset
      (`legacy.AVAILABLE - target.available == pending`) is the **accepted final
      difference** and is asserted, not tolerated, by the Level 3 pack (see README.md).

    Admin – reference-data CRUD (`HRMS_ADMIN.fmb` replacement):
    * Full CRUD for departments, job titles, job grades, locations, leave types, system
      parameters. Rows are **never physically deleted** (legacy grids only toggled
      `ACTIVE_FLAG`); `DELETE` = deactivate (`activeFlag=N`) and is refused with `-20602`
      while active dependants exist. Codes are immutable after creation (`-20601` on a
      duplicate). Every write appends an `AUDIT_LOG` row (`action_type` INSERT / UPDATE /
      STATUS_CHANGE, `changed_by = jwt.sub`) from Java – no trigger.
    * `POST /api/admin/leave/accrual` and `/api/admin/leave/carryover` are the mounted
      form of the routes P2 declared as `x-deferred` (`/api/leave/admin/accrual/run`,
      `/api/leave/admin/carryover/run`); the P2 paths become **301 aliases** to these.
      Both run asynchronously (Spring Batch job in `leave-module`, which still owns
      `leave_balances` / `leave_accrual_log`; `admin-module` only triggers) and return
      `202` + `BatchRunResult`.
    * `GET /api/admin/audit-log` is the read side of `AUDIT_LOG` (replaces the
      `HRMS_ADMIN` audit block and `trg_*_audit`). Old/new values are returned as
      opaque JSON strings; never filtered on.

    Integration (`PKG_INTEGRATION` replacement, no `UTL_FILE`):
    * A feed run creates an `integration_files` row and writes the artefact to object
      storage (`S3`-compatible bucket `hrms-integration`, key
      `{feed}/{yyyy}/{MM}/{fileId}-{fileName}`); the API returns metadata + a **download
      route** (`GET /api/integration/files/{fileId}/content`) that streams the bytes
      (`Content-Disposition: attachment`). There are **no directory objects**;
      `GL_FEED_OUT` / `BENEFITS_FEED_OUT` / `TIME_IMPORT_IN` are dropped.
    * GL feed: pipe-delimited `H|D…|T` exactly as `generate_gl_journal` (earnings →
      debit, taxes/deductions → credit magnitudes, one `D` per `cost_center × gl_account`,
      `T|count`). Only runs in `APPROVED` or `PAID` may be exported (`-20701`).
    * Benefits feed: fixed-width ADP layout of `export_benefits_feed` (employee + dependant
      records, SSN **masked** `***-**-1234` – the legacy wrote the full SSN; SEC-05).
    * Time-attendance import (**BUG-08**): the legacy body is a `TODO` that parses
      `emp_number,date,hours_regular,hours_overtime` and writes nothing. The target
      **freezes the file grammar, validation and the response** but the persistence
      target is `x-unspecified` (there is no time/attendance table in the schema and no
      pay element mapping). `POST /api/integration/time-attendance/import` therefore
      validates, stages rows into `integration_files` (`status=STAGED`) and returns the
      per-line verdicts; **no payroll/leave data is mutated in Phase 5**. The unspecified
      fields are marked `x-unspecified: BUG-08` on the schemas below.
    * `sync_org_structure` (legacy no-op) has no target route. `get_integration_status`
      → `GET /api/integration/status`.

    Reference-data ownership / CDC (CUTOVER_PLAN.md §9, §2 rule 6):
    * In this phase the reference tables' system of record becomes PostgreSQL. CDC
      direction for the reference group **reverses** (PostgreSQL → Oracle, `tools/cdc-sync
      reverse --group reference`) for the Forms-decommission window and is then **shut
      down** (`debezium/hrms-oracle-source.json` `table.include.list` empty, connectors
      deleted). Declared in README.md; delivered as code + unit tests, `untested-live`.

    Proxy flags (`proxy/flags.env`): `reporting=LEGACY|NEW` gates `/api/reports/**`,
    `/api/admin/**`, `/api/integration/**` and the React `/reports`, `/admin`,
    `/integration` routes. `HRMS_FLAG_REPORTING=NEW` is the last flip; after it every
    flag is `NEW` and the proxy's `LEGACY` upstream is removed (decommission).

    Status codes used by this module: 200, 201, 202, 204, 301, 304, 400, 401, 403,
    404, 406, 409, 415, 422. Documented `-20xxx` failures are 4xx bodies; framework
    codes are listed in `error-codes.md` §2.
servers:
  - url: /
    description: Behind the P0 reverse proxy (flag `reporting`).
security:
  - bearerAuth: []
tags:
  - name: reports
  - name: admin-reference
  - name: admin-leave-jobs
  - name: admin-audit
  - name: admin-payroll-reference
  - name: admin-roles
  - name: integration

paths:
  # ---------------------------------------------------------------------------
  # reports (read-only) – JSON page or CSV stream
  # ---------------------------------------------------------------------------
  /api/reports/employee-directory:
    get:
      tags: [reports]
      operationId: reportEmployeeDirectory
      summary: "`VW_ACTIVE_EMPLOYEES` + `PKG_REPORTING.headcount_report` filters"
      description: |
        One row per `EMPLOYEES.EMPLOYMENT_STATUS='ACTIVE'` employee joined to department,
        job, grade, location and manager. `tenureYears = TRUNC(MONTHS_BETWEEN(asOf,
        hireDate)/12, 1)` (Oracle semantics). `summary.headcountByDepartment` is
        `headcount_report` (`p_as_of_date`, `p_dept_id`, `p_location`): active employees
        with `hireDate <= asOf`, grouped by department, with `avgTenureYears`.
        Sorted by `empId`.
      x-preauthorize: hasAuthority('REPORTS:VIEW')
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/DeptId'
        - $ref: '#/components/parameters/LocationCode'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: "Directory rows (`Accept: application/json` → page; `text/csv` → stream)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDirectoryPage'
            text/csv:
              schema: { type: string }
              example: "empId,empNumber,firstName,lastName,fullName,email,phoneWork,hireDate,tenureYears,deptId,deptCode,deptName,costCenter,jobId,jobCode,jobTitle,jobFamily,gradeId,gradeCode,gradeName,locationCode,locationName,city,stateProvince,managerEmpId,managerName\n"
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /api/reports/employee-directory.csv:
    get:
      tags: [reports]
      operationId: reportEmployeeDirectoryCsv
      summary: CSV alias of `/api/reports/employee-directory` (all rows, no paging)
      x-preauthorize: hasAuthority('REPORTS:VIEW')
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/DeptId'
        - $ref: '#/components/parameters/LocationCode'
      responses:
        '200':
          $ref: '#/components/responses/CsvStream'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/reports/org-hierarchy:
    get:
      tags: [reports]
      operationId: reportOrgHierarchy
      summary: "`VW_ORG_HIERARCHY` (`CONNECT BY` → `WITH RECURSIVE`)"
      description: |
        Walks **all** employees from the roots (`managerEmpId IS NULL`) with `WITH
        RECURSIVE` and filters `employmentStatus='ACTIVE'` in the outer select, exactly
        like Oracle applies the view `WHERE` after `CONNECT BY` (active reports of a
        terminated manager keep their `orgLevel` / `orgPath`, `tests/golden/README.md`).
        `orgPath = SYS_CONNECT_BY_PATH(fullName, ' > ')` without the leading separator;
        `isLeaf` = `CONNECT_BY_ISLEAF` (counts terminated children). Cycle protection:
        a manager chain that revisits an `empId` stops at the repeat (legacy would raise
        `ORA-01436`); the row is flagged `cycle=true` – a target-only field, `-20004`
        prevents new cycles at write time (P3). `rootEmpId` restricts to one sub-tree.
        Sorted by `orgPath`.
      x-preauthorize: hasAuthority('REPORTS:VIEW')
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - in: query
          name: rootEmpId
          required: false
          description: Sub-tree root (`EMPLOYEES.EMP_ID`); default = all roots.
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: maxLevel
          required: false
          schema: { type: integer, minimum: 1, maximum: 20 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Hierarchy rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgHierarchyPage'
            text/csv:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EmployeeNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /api/reports/org-hierarchy.csv:
    get:
      tags: [reports]
      operationId: reportOrgHierarchyCsv
      summary: CSV alias of `/api/reports/org-hierarchy`
      x-preauthorize: hasAuthority('REPORTS:VIEW')
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - in: query
          name: rootEmpId
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: maxLevel
          required: false
          schema: { type: integer, minimum: 1, maximum: 20 }
      responses:
        '200':
          $ref: '#/components/responses/CsvStream'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EmployeeNotFound'

  /api/reports/employee-compensation:
    get:
      tags: [reports]
      operationId: reportEmployeeCompensation
      summary: "`VW_EMPLOYEE_COMPENSATION` + `PKG_REPORTING.compensation_summary`"
      description: |
        One row per active employee with the current `SALARY_RECORDS` row
        (`endDate IS NULL`), grade band, `compaRatio = ROUND(baseSalary /
        ((minSalary+maxSalary)/2), 4)` and `yearsInGrade` (`MONTHS_BETWEEN` semantics
        from `effectiveDate`). `summary.byDepartment` reproduces `compensation_summary`
        (`p_dept_id`, `p_grade_id`): `headcount`, `avgSalary`, `minSalary`, `maxSalary`,
        `totalPayroll` per department. **Requires `PAYROLL:VIEW` in addition to
        `REPORTS:VIEW`** – the legacy `HRMS_REPORTS` form hid this report unless
        `has_permission('PAYROLL')`. `baseSalary` is never masked in this report (SEC-05
        applies to SSN/bank data, not salary). Sorted by `empId`.
      x-preauthorize: hasAuthority('REPORTS:VIEW') and hasAuthority('PAYROLL:VIEW')
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/DeptId'
        - in: query
          name: gradeId
          required: false
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Compensation rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCompensationPage'
            text/csv:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /api/reports/employee-compensation.csv:
    get:
      tags: [reports]
      operationId: reportEmployeeCompensationCsv
      summary: CSV alias of `/api/reports/employee-compensation`
      x-preauthorize: hasAuthority('REPORTS:VIEW') and hasAuthority('PAYROLL:VIEW')
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/DeptId'
        - in: query
          name: gradeId
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          $ref: '#/components/responses/CsvStream'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/reports/leave-summary:
    get:
      tags: [reports]
      operationId: reportLeaveSummary
      summary: "`VW_LEAVE_SUMMARY` with VAL-05 fixed + `leave_utilization_report`"
      description: |
        One row per `(activeEmployee, leaveType)` balance of `year` (default
        `EXTRACT(YEAR FROM asOf)`). **VAL-05:** `available = openingBalance + accrued -
        used + adjustment - pending` (legacy view omitted `- pending`; accepted final
        difference, README.md). `utilizationPct = ROUND(used*100 / NULLIF(openingBalance
        + accrued, 0), 1)` (null when the denominator is 0, as Oracle). `pending` is
        exposed so the Level 3 pack can assert `legacyAvailable - available == pending`.
        `summary.byLeaveType` reproduces `leave_utilization_report` (`p_year`,
        `p_dept_id`): `employees`, `totalAccrued`, `totalUsed`, `avgUtilizationPct`.
        `EMPLOYEE:VIEW` is not required: the report has no self-scope – `REPORTS:VIEW`
        holders (MANAGER+) see the whole company, as in `HRMS_REPORTS`. Sorted by `empId`,
        `leaveTypeName`.
      x-preauthorize: hasAuthority('REPORTS:VIEW')
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/DeptId'
        - in: query
          name: leaveTypeId
          required: false
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Leave summary rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveSummaryPage'
            text/csv:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /api/reports/leave-summary.csv:
    get:
      tags: [reports]
      operationId: reportLeaveSummaryCsv
      summary: CSV alias of `/api/reports/leave-summary`
      x-preauthorize: hasAuthority('REPORTS:VIEW')
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/DeptId'
        - in: query
          name: leaveTypeId
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          $ref: '#/components/responses/CsvStream'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/reports/payroll-latest:
    get:
      tags: [reports]
      operationId: reportPayrollLatest
      summary: "`VW_PAYROLL_LATEST` + `PKG_REPORTING.payroll_summary_report`"
      description: |
        Per-employee aggregates of the **latest `PAYROLL_RUNS` row per period**
        (`MAX(run_id)` per `period_id`, as the view's inline `PAYROLL_RUNS` sub-select),
        default = the latest period with a run in `APPROVED`/`PAID`; `periodId` selects
        another. `STATUS='ERROR'` rows are excluded (P4 contract). `grossPay` /
        `totalTaxes` / `totalDeductions` are positive magnitudes, `netPay = SUM(amount)`
        (P4 sign convention). `summary` is `payroll_summary_report(p_period_id)`:
        `employeeCount`, `totalGross`, `totalTaxes`, `totalDeductions`, `totalNet`,
        `avgNet`. Requires `PAYROLL:VIEW`. Sorted by `empId`.
      x-preauthorize: hasAuthority('REPORTS:VIEW') and hasAuthority('PAYROLL:VIEW')
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/DeptId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Payroll rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollLatestPage'
            text/csv:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PeriodNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /api/reports/payroll-latest.csv:
    get:
      tags: [reports]
      operationId: reportPayrollLatestCsv
      summary: CSV alias of `/api/reports/payroll-latest`
      x-preauthorize: hasAuthority('REPORTS:VIEW') and hasAuthority('PAYROLL:VIEW')
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/DeptId'
      responses:
        '200':
          $ref: '#/components/responses/CsvStream'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PeriodNotFound'

  /api/reports/pending-approvals:
    get:
      tags: [reports]
      operationId: reportPendingApprovals
      summary: "`VW_PENDING_APPROVALS` (leave requests ∪ performance reviews)"
      description: |
        `UNION ALL` of `LEAVE_REQUESTS.STATUS='PENDING'` (`itemType=LEAVE`) and
        `PERFORMANCE_REVIEWS.STATUS='SUBMITTED'` (`itemType=REVIEW`), each with the
        employee, the approver (`manager_emp_id` / `reviewer_emp_id`) and `daysPending =
        TRUNC(asOf - submittedDate)`. Column names are unified as in the view
        (`itemType, itemId, empId, empName, deptName, approverEmpId, approverName,
        submittedDate, daysPending, detail`). `mine=true` restricts to
        `approverEmpId = jwt.empId` (the manager inbox); without `mine` the caller needs
        `REPORTS:VIEW`, with `mine=true` `isAuthenticated()` suffices. Sorted by
        `submittedDate`, `itemType`, `itemId`.
      x-preauthorize: "hasAuthority('REPORTS:VIEW') or #mine == true"
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - in: query
          name: itemType
          required: false
          schema: { type: string, enum: [LEAVE, REVIEW] }
        - in: query
          name: mine
          required: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/DeptId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Pending items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingApprovalPage'
            text/csv:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
