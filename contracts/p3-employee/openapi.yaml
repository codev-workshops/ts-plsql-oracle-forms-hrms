          $ref: '#/components/responses/Unauthorized'

  /api/reference/locations:
    get:
      tags: [reference]
      operationId: listLocations
      summary: P0 `listLocations` - unchanged (`RG_LOCATIONS`)
      description: Identical to `contracts/p0-foundation/openapi.yaml`.
      x-preauthorize: isAuthenticated()
      parameters:
        - $ref: '#/components/parameters/ActiveFilter'
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationRef'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        P0 access token (frozen; issued by `auth-service.JwtService`). Claims: `sub` =
        `user_accounts.user_id` (audit actor for `createdBy` / `modifiedBy` / `changedBy`),
        `empId` = acting employee ID (row-level "self" scope), `roles[]` (expanded to the
        `x-preauthorize` authorities), `jti`, `iat`, `exp`. There is no `username` claim.

  parameters:
    EmployeeId:
      in: path
      name: id
      required: true
      description: "`EMPLOYEES.EMP_ID` (never the `empNumber`)."
      schema: { type: integer, format: int64, minimum: 1 }
    IfMatch:
      in: header
      name: If-Match
      required: true
      description: "`EmployeeDetail.version` as returned by the last `GET`/`PUT` (`\"7\"`)."
      schema: { type: string, pattern: '^"?[0-9]+"?$' }
    ActiveFilter:
      in: query
      name: active
      required: false
      schema: { type: boolean, default: true }
    Page:
      in: query
      name: page
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      in: query
      name: size
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationFailed:
      description: Bean Validation / unsupported query value (`hrms-validation` rules, see `validation-schema.json` module `p3-employee`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example: { code: VALIDATION_FAILED, message: Phone number must contain 10 or 11 digits, field: phoneWork, traceId: 4f3c… }
    Unauthorized:
      description: Missing / invalid / revoked token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example: { code: TOKEN_INVALID, message: Access token is missing or invalid, traceId: 4f3c… }
    Forbidden:
      description: "`@PreAuthorize` denied or caller outside the row-level scope (self / `EMPLOYEE:EDIT` / `PAYROLL:VIEW`)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example: { code: FORBIDDEN, message: Access denied, traceId: 4f3c… }
    EmployeeNotFound:
      description: "`-20001`: `{id}` matches no `employees` row"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example: { code: '-20001', message: Employee not found or not active, traceId: 4f3c… }
    DirectReactivationForbidden:
      description: "`-20503`: write against a `TERMINATED` employee (direct reactivation / edit forbidden - use the rehire process, not in this contract)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example: { code: '-20503', message: 'Cannot directly reactivate a terminated employee. Use the rehire process.', traceId: 4f3c… }
    ModuleReadOnly:
      description: "`MODULE_READ_ONLY`: write route reached while `employee=NEW_READONLY`"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example: { code: MODULE_READ_ONLY, message: Employee module is read-only during cutover, traceId: 4f3c… }

  schemas:
    ApiError:
      type: object
      required: [code, message, traceId]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Legacy `-20xxx` as a string, or a framework code (`error-codes.md`).
        message: { type: string }
        field:
          type: [string, 'null']
          description: Offending request field (body property, header or query parameter name) when attributable.
        traceId:
          type: string
          description: Correlates with `error_log.trace_id` / `X-Trace-Id`.
        details:
          type: array
          description: All violations for `VALIDATION_FAILED`.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Authority:
      type: string
      description: |
        P0 vocabulary plus the Phase 3 addition `PAYROLL:EDIT` (record salary changes). Seeding
        (Flyway migration owned by the P3 backend node): `EXECUTIVE` (grade >= 8) and the HR
        role get `EMPLOYEE:EDIT` and `PAYROLL:EDIT`; `PAYROLL:VIEW` keeps its P0 seeding;
        `EMPLOYEE:VIEW` stays granted to everyone (`PKG_SECURITY.has_permission`).
      pattern: '^(PAYROLL|EMPLOYEE|LEAVE|ADMIN|REPORTS|PERFORMANCE):(VIEW|EDIT|APPROVE|CREATE|ADMIN|VIEW_ALL)$'
      examples: [EMPLOYEE:VIEW, EMPLOYEE:EDIT, PAYROLL:VIEW, PAYROLL:EDIT]

    Money:
      type: string
      pattern: '^-?[0-9]+\.[0-9]{2}$'
      description: Decimal string with exactly two decimals (`NUMBER(12,2)`); never a float.

    EmploymentStatus:
      type: string
      enum: [ACTIVE, ON_LEAVE, SUSPENDED, TERMINATED]
      description: "`EMPLOYEES.CHK_EMP_STATUS`. `ON_LEAVE`/`SUSPENDED` are not produced by any P3 operation (accepted in filters)."
    EmploymentType:
      type: string
      enum: [FULL_TIME, PART_TIME, CONTRACT, INTERN]
    Gender:
      type: string
      enum: [M, F, O]
    Relationship:
      type: string
      enum: [SPOUSE, CHILD, PARENT, DOMESTIC_PARTNER, OTHER]
      description: "`EMPLOYEE_DEPENDENTS.CHK_RELATIONSHIP`"
    HistoryChangeType:
      type: string
      enum: [HIRE, TRANSFER, PROMOTION, DEMOTION, SALARY_CHANGE, TERMINATION, REHIRE, LEAVE_START, LEAVE_END, STATUS_CHANGE]
      description: "`EMPLOYEE_HISTORY.CHK_CHANGE_TYPE`. P3 writes `HIRE`, `TRANSFER`, `PROMOTION`, `SALARY_CHANGE`, `TERMINATION`; the others are read-only legacy/seed values."
    PayFrequency:
      type: string
      enum: [WEEKLY, BIWEEKLY, SEMIMONTHLY, MONTHLY]
    SalaryBasis:
      type: string
      enum: [ANNUAL, HOURLY]

    # --------------------------------------------------------------- requests
    EmployeeCreateRequest:
      type: object
      description: |
        `hrms-validation` `dto/employee/EmployeeCreateRequest`. No `empNumber`, no
        `employmentStatus`, no acting-user identity. Blank strings → `null`.
      required: [firstName, lastName, hireDate, deptId, jobId]
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 50 }
        middleName: { type: [string, 'null'], maxLength: 50 }
        lastName: { type: string, minLength: 1, maxLength: 50 }
        dateOfBirth: { type: [string, 'null'], format: date, description: "Must not be in the future." }
        gender:
          oneOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        maritalStatus: { type: [string, 'null'], maxLength: 10 }
        nationality: { type: [string, 'null'], maxLength: 50 }
        ssn:
          type: [string, 'null']
          pattern: '^[0-9]{3}-?[0-9]{2}-?[0-9]{4}$'
          maxLength: 11
          writeOnly: true
          description: "`@Ssn`: 9 digits, optional dashes, no all-zero group. Encrypted at rest, never echoed (`ssnLast4` only)."
        email:
          type: [string, 'null']
          format: email
          maxLength: 100
          description: Bean Validation `@Email` (VAL-02 - sub-domains accepted). Unique among active employees (`-20502`).
        phoneWork:
          type: [string, 'null']
          maxLength: 30
          pattern: '^(?:\D*\d){10,11}\D*$'
          description: "`PKG_COMMON.is_valid_phone`: 10 or 11 digits after stripping non-digits (VAL-03)."
        phoneMobile:
          type: [string, 'null']
          maxLength: 30
          pattern: '^(?:\D*\d){10,11}\D*$'
        addressLine1: { type: [string, 'null'], maxLength: 200 }
        addressLine2: { type: [string, 'null'], maxLength: 200 }
        city: { type: [string, 'null'], maxLength: 100 }
        stateProvince: { type: [string, 'null'], maxLength: 100 }
        postalCode: { type: [string, 'null'], maxLength: 20 }
        countryCode: { type: [string, 'null'], pattern: '^[A-Z]{2,3}$' }
        hireDate:
          type: string
          format: date
          description: "`@HireDateWithinLimit`: `<= today + HR.MAX_FUTURE_HIRE_DAYS (90)` → `-20501`."
        deptId: { type: integer, format: int64, minimum: 1, description: "Active department (`-20003`)." }
        jobId: { type: integer, format: int64, minimum: 1, description: "Active job title (`-20011`)." }
        managerEmpId: { type: [integer, 'null'], format: int64, minimum: 1, description: "Active employee, acyclic (`-20004`)." }
        locationCode: { type: [string, 'null'], pattern: '^[A-Z0-9]{1,10}$' }
        employmentType:
          oneOf:
            - $ref: '#/components/schemas/EmploymentType'
            - type: 'null'
          description: Default `FULL_TIME`.
        initialSalary:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: "`> 0` (`-20101`). Written by `salary-module` in the hire transaction (`changeReason = INITIAL`)."
        notes: { type: [string, 'null'], maxLength: 4000 }

    EmployeeUpdateRequest:
      type: object
      description: |
        `dto/employee/EmployeeUpdateRequest`. Full replacement of the editable set. Excludes
        `empNumber`, `hireDate`, `deptId` (transfer), `employmentStatus`, termination fields.
      required: [firstName, lastName, jobId]
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 50 }
        middleName: { type: [string, 'null'], maxLength: 50 }
        lastName: { type: string, minLength: 1, maxLength: 50 }
        dateOfBirth: { type: [string, 'null'], format: date }
        gender:
          oneOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        maritalStatus: { type: [string, 'null'], maxLength: 10 }
        nationality: { type: [string, 'null'], maxLength: 50 }
        ssn:
          type: [string, 'null']
          pattern: '^[0-9]{3}-?[0-9]{2}-?[0-9]{4}$'
          maxLength: 11
          writeOnly: true
          description: Absent / `null` = unchanged (an SSN cannot be cleared through the API).
        email: { type: [string, 'null'], format: email, maxLength: 100 }
        phoneWork: { type: [string, 'null'], maxLength: 30, pattern: '^(?:\D*\d){10,11}\D*$' }
        phoneMobile: { type: [string, 'null'], maxLength: 30, pattern: '^(?:\D*\d){10,11}\D*$' }
        addressLine1: { type: [string, 'null'], maxLength: 200 }
        addressLine2: { type: [string, 'null'], maxLength: 200 }
        city: { type: [string, 'null'], maxLength: 100 }
        stateProvince: { type: [string, 'null'], maxLength: 100 }
        postalCode: { type: [string, 'null'], maxLength: 20 }
        countryCode: { type: [string, 'null'], pattern: '^[A-Z]{2,3}$' }
        jobId: { type: integer, format: int64, minimum: 1, description: "Change → `employee_history` `PROMOTION` (`-20011` if inactive)." }
        managerEmpId: { type: [integer, 'null'], format: int64, minimum: 1 }
        employmentType:
          oneOf:
            - $ref: '#/components/schemas/EmploymentType'
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 4000 }

    EmployeeTerminateRequest:
      type: object
      required: [effectiveDate, reason]
      additionalProperties: false
      properties:
        effectiveDate: { type: string, format: date, description: "`TERMINATION_DATE`; `>= hireDate`." }
        reason: { type: string, minLength: 1, maxLength: 50, description: "`TERMINATION_REASON` / history `reason_code`." }
        comments: { type: [string, 'null'], maxLength: 4000 }

    EmployeeTransferRequest:
      type: object
      description: "`PKG_EMPLOYEE.transfer_employee(p_new_dept_id, p_new_job_id, p_new_manager_id, p_new_location, p_effective_date, p_reason, p_comments)`."
      required: [effectiveDate, deptId]
      additionalProperties: false
      properties:
        effectiveDate: { type: string, format: date }
        deptId: { type: integer, format: int64, minimum: 1, description: "Target department (`-20003`)." }
        newJobId: { type: [integer, 'null'], format: int64, minimum: 1, description: "Optional new job (`-20011`)." }
        newManagerEmpId: { type: [integer, 'null'], format: int64, minimum: 1, description: "Optional new manager (`-20004`)." }
        newLocationCode: { type: [string, 'null'], pattern: '^[A-Z0-9]{1,10}$' }
        reasonCode: { type: [string, 'null'], maxLength: 30 }
        comments: { type: [string, 'null'], maxLength: 4000 }

    SalaryChangeRequest:
      type: object
      description: "`PKG_PAYROLL.create_salary_record` input (salary-module)."
      required: [effectiveDate, baseSalary, changeReason]
      additionalProperties: false
      properties:
        effectiveDate: { type: string, format: date, description: "`>= hireDate` and `>= current.effectiveDate`." }
        baseSalary:
          $ref: '#/components/schemas/Money'
          description: "`> 0` → `-20101`. `NUMBER(12,2)`."
        currencyCode: { type: [string, 'null'], pattern: '^[A-Z]{3}$', description: "Default `USD`." }
        payFrequency:
          oneOf:
            - $ref: '#/components/schemas/PayFrequency'
            - type: 'null'
          description: Default `MONTHLY`.
        salaryBasis:
          oneOf:
            - $ref: '#/components/schemas/SalaryBasis'
            - type: 'null'
          description: Default `ANNUAL`.
        changeReason: { type: string, minLength: 1, maxLength: 50, description: "Free text (`SALARY_RECORDS.CHANGE_REASON`, no CHECK constraint); e.g. `MERIT`, `PROMOTION`, `ADJUSTMENT`." }

    DependentRequest:
      type: object
      required: [firstName, lastName, relationship]
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 50 }
        lastName: { type: string, minLength: 1, maxLength: 50 }
        relationship:
          $ref: '#/components/schemas/Relationship'
        dateOfBirth: { type: [string, 'null'], format: date }
        ssn:
          type: [string, 'null']
          pattern: '^[0-9]{3}-?[0-9]{2}-?[0-9]{4}$'
          maxLength: 11
          writeOnly: true
          description: "`@Ssn`; never echoed."
        benefitsEnrolled: { type: [boolean, 'null'], description: "Default `false`." }
        active: { type: [boolean, 'null'], description: "`false` on `PUT` soft-deletes the dependent (ignored on `POST`)." }

    EmergencyContactRequest:
      type: object
      required: [contactName, phonePrimary]
      additionalProperties: false
      properties:
        contactName: { type: string, minLength: 1, maxLength: 100 }
        relationship: { type: [string, 'null'], maxLength: 30 }
        phonePrimary: { type: string, maxLength: 30, pattern: '^(?:\D*\d){10,11}\D*$' }
        phoneSecondary: { type: [string, 'null'], maxLength: 30, pattern: '^(?:\D*\d){10,11}\D*$' }
        email: { type: [string, 'null'], format: email, maxLength: 100 }
        priorityOrder: { type: [integer, 'null'], minimum: 1, maximum: 99, description: "Default `1`." }
        active: { type: [boolean, 'null'], description: "`false` on `PUT` soft-deletes the contact (ignored on `POST`)." }

    # --------------------------------------------------------------- responses
    EmployeeDetail:
      type: object
      description: |
        `VW_EMPLOYEE_DETAILS` semantics as a DTO (one join). Never contains the SSN, the
        encrypted SSN, `PHOTO_BLOB` or salary. Read-only server fields: `id`, `empNumber`,
        `employmentStatus`, `active`, `terminationDate`, `terminationReason`, `version`,
        audit columns.
      required: [id, empNumber, firstName, lastName, hireDate, deptId, deptName, jobId, jobTitle, employmentType, employmentStatus, active, version, createdBy, createdDate]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        empNumber: { type: string, pattern: '^EMP-[0-9]{6}$', readOnly: true, description: "Assigned from `SEQ_EMP_NUMBER`." }
        firstName: { type: string }
        middleName: { type: [string, 'null'] }
        lastName: { type: string }
        dateOfBirth: { type: [string, 'null'], format: date }
        gender:
          oneOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        maritalStatus: { type: [string, 'null'] }
        nationality: { type: [string, 'null'] }
        ssnLast4:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
          description: Last four digits, only for `EMPLOYEE:EDIT` holders or the employee themselves; otherwise `null`. Also `null` when no SSN is stored.
        email: { type: [string, 'null'] }
        phoneWork: { type: [string, 'null'] }
        phoneMobile: { type: [string, 'null'] }
        addressLine1: { type: [string, 'null'] }
        addressLine2: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        stateProvince: { type: [string, 'null'] }
        postalCode: { type: [string, 'null'] }
        countryCode: { type: [string, 'null'] }
        hireDate: { type: string, format: date }
        terminationDate: { type: [string, 'null'], format: date }
        terminationReason: { type: [string, 'null'] }
        deptId: { type: integer, format: int64 }
        deptName: { type: string, description: "`POST-QUERY` `DEPT_NAME_DISP`" }
        jobId: { type: integer, format: int64 }
        jobTitle: { type: string, description: "`JOB_TITLE_DISP`" }
        gradeCode: { type: [string, 'null'] }
        managerEmpId: { type: [integer, 'null'], format: int64 }
        managerName: { type: [string, 'null'], description: "`MANAGER_NAME_DISP` (`firstName + ' ' + lastName`)" }
        locationCode: { type: [string, 'null'] }
        locationName: { type: [string, 'null'] }
        employmentType:
          $ref: '#/components/schemas/EmploymentType'
        employmentStatus:
          $ref: '#/components/schemas/EmploymentStatus'
        active: { type: boolean, description: "`ACTIVE_FLAG='Y'`" }
        notes: { type: [string, 'null'] }
        version: { type: integer, minimum: 0, description: "JPA `@Version`; echo in `If-Match`." }
        createdBy: { type: string }
        createdDate: { type: string, format: date-time }
        modifiedBy: { type: [string, 'null'] }
        modifiedDate: { type: [string, 'null'], format: date-time }

    EmployeeListItem:
      type: object
      description: Search-grid row (no sensitive columns).
      required: [id, empNumber, firstName, lastName, deptId, deptName, jobId, jobTitle, hireDate, employmentStatus, active]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        empNumber: { type: string, pattern: '^EMP-[0-9]{6}$' }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: [string, 'null'] }
        deptId: { type: integer, format: int64 }
        deptName: { type: string }
        jobId: { type: integer, format: int64 }
        jobTitle: { type: string }
        managerEmpId: { type: [integer, 'null'], format: int64 }
        managerName: { type: [string, 'null'] }
        locationCode: { type: [string, 'null'] }
        hireDate: { type: string, format: date }
        employmentType:
          $ref: '#/components/schemas/EmploymentType'
        employmentStatus:
          $ref: '#/components/schemas/EmploymentStatus'
        active: { type: boolean }

    PageOfEmployeeListItem:
      type: object
      required: [content, page, size, totalElements, totalPages]
      additionalProperties: false
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeListItem'
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    EmployeeSummary:
      type: object
      description: P0 projection `fields=id,name,jobTitle` (manager LOV) - unchanged.
      required: [id, empNumber, name, jobTitle]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        empNumber: { type: string, pattern: '^EMP-[0-9]{6}$' }
        name: { type: string, description: "`firstName + ' ' + lastName`" }
        jobTitle: { type: [string, 'null'] }

    PageOfEmployeeSummary:
      type: object
      required: [content, page, size, totalElements, totalPages]
      additionalProperties: false
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeSummary'
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    SalaryRecord:
      type: object
      description: "`SALARY_RECORDS` row (salary-module). `changePct` as an exact two-decimal string (PostgreSQL `NUMERIC(16,2)`, wider than the legacy Oracle `NUMBER(5,2)`), e.g. `\"5.00\"` or `\"1415.15\"`."
      required: [salaryId, empId, effectiveDate, baseSalary, currencyCode, payFrequency, salaryBasis, active, outOfGradeBand, createdBy, createdDate]
      additionalProperties: false
      properties:
        salaryId: { type: integer, format: int64 }
        empId: { type: integer, format: int64 }
        effectiveDate: { type: string, format: date }
        endDate: { type: [string, 'null'], format: date, description: "`null` on the active row." }
        baseSalary:
          $ref: '#/components/schemas/Money'
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        payFrequency:
          $ref: '#/components/schemas/PayFrequency'
        salaryBasis:
          $ref: '#/components/schemas/SalaryBasis'
        changeReason: { type: [string, 'null'] }
        changePct:
          type: [string, 'null']
          pattern: '^-?[0-9]+\.[0-9]{2}$'
          description: "Exact `ROUND((new - old) / old * 100, 2)` for the whole valid `Money` range - never clipped or rejected, range `[-100.00, 99999999999800.00]`; `null` for the first record (no prior salary)."
        active: { type: boolean, description: "`ACTIVE_FLAG='Y'` - exactly one per employee." }
        outOfGradeBand: { type: boolean, description: "`baseSalary` outside `[gradeMinSalary, gradeMaxSalary]` of the employee's job grade at creation time (advisory)." }
        createdBy: { type: string }
        createdDate: { type: string, format: date-time }

    EmployeeHistoryEntry:
      type: object
      description: "`EMPLOYEE_HISTORY` row against the real DDL columns (BUG-03), joined to names."
      required: [histId, empId, changeType, effectiveDate, createdBy, createdDate]
      additionalProperties: false
      properties:
        histId: { type: integer, format: int64 }
        empId: { type: integer, format: int64 }
        changeType:
          $ref: '#/components/schemas/HistoryChangeType'
        effectiveDate: { type: string, format: date }
        oldDeptId: { type: [integer, 'null'], format: int64 }
        oldDeptName: { type: [string, 'null'] }
        newDeptId: { type: [integer, 'null'], format: int64 }
        newDeptName: { type: [string, 'null'] }
        oldJobId: { type: [integer, 'null'], format: int64 }
        oldJobTitle: { type: [string, 'null'] }
        newJobId: { type: [integer, 'null'], format: int64 }
        newJobTitle: { type: [string, 'null'] }
        oldManagerId: { type: [integer, 'null'], format: int64 }
        oldManagerName: { type: [string, 'null'] }
        newManagerId: { type: [integer, 'null'], format: int64 }
        newManagerName: { type: [string, 'null'] }
        oldSalary:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Salary read scope only, otherwise `null`.
        newSalary:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        oldLocation: { type: [string, 'null'] }
        newLocation: { type: [string, 'null'] }
        reasonCode: { type: [string, 'null'] }
        comments: { type: [string, 'null'] }
        createdBy: { type: string }
        createdDate: { type: string, format: date-time }

    Dependent:
      type: object
      required: [dependentId, empId, firstName, lastName, relationship, benefitsEnrolled, active]
      additionalProperties: false
      properties:
        dependentId: { type: integer, format: int64 }
        empId: { type: integer, format: int64 }
        firstName: { type: string }
        lastName: { type: string }
        relationship:
          $ref: '#/components/schemas/Relationship'
        dateOfBirth: { type: [string, 'null'], format: date }
        ssnLast4: { type: [string, 'null'], pattern: '^[0-9]{4}$', description: "Never the full SSN." }
        benefitsEnrolled: { type: boolean }
        active: { type: boolean }

    EmergencyContact:
      type: object
      required: [contactId, empId, contactName, phonePrimary, priorityOrder, active]
      additionalProperties: false
      properties:
        contactId: { type: integer, format: int64 }
        empId: { type: integer, format: int64 }
        contactName: { type: string }
        relationship: { type: [string, 'null'] }
        phonePrimary: { type: string }
        phoneSecondary: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        priorityOrder: { type: integer, minimum: 1, maximum: 99 }
        active: { type: boolean }

    # --------------------------------------------------------------- reference (P0, unchanged)
    DepartmentRef:
      type: object
      required: [deptId, deptCode, deptName, active]
      additionalProperties: false
      properties:
        deptId: { type: integer, format: int64 }
        deptCode: { type: string, maxLength: 20 }
        deptName: { type: string, maxLength: 100 }
        parentDeptId: { type: [integer, 'null'], format: int64 }
        locationCode: { type: [string, 'null'], maxLength: 10 }
        active: { type: boolean }

    JobTitleRef:
      type: object
      required: [jobId, jobCode, jobTitle, gradeId, gradeCode, gradeName, gradeMinSalary, gradeMaxSalary, active]
      additionalProperties: false
      properties:
        jobId: { type: integer, format: int64 }
        jobCode: { type: string, maxLength: 20 }
        jobTitle: { type: string, maxLength: 100 }
        jobFamily: { type: [string, 'null'], maxLength: 50 }
        gradeId: { type: integer }
        gradeCode: { type: string, maxLength: 10 }
        gradeName: { type: string, maxLength: 50 }
        gradeMinSalary:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: "`JOB_GRADES.MIN_SALARY` - UI pre-warning only."
        gradeMaxSalary:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: "`JOB_GRADES.MAX_SALARY` - UI pre-warning only."
        active: { type: boolean }

    LocationRef:
      type: object
      required: [locationCode, locationName, active]
      additionalProperties: false
      properties:
        locationCode: { type: string, maxLength: 10 }
        locationName: { type: string, maxLength: 100 }
        city: { type: [string, 'null'] }
        stateProvince: { type: [string, 'null'] }
        countryCode: { type: [string, 'null'], maxLength: 3 }
        timezone: { type: string }
        active: { type: boolean }
