openapi: 3.0.3
info:
  title: HRMS API
  version: 1.4.0
  x-contract-version: v1.4
  description: |
    **Frozen contract v1** (checkpoint §3 and §7, frozen by P3 on 2026-11-20). P2 authored auth,
    sessions, permission matrix, menu backend, change-password and the employee read model; P3 added
    the leave pilot and froze the file. Any change to a route, schema, error code or status from
    here on is a versioned amendment (`v1.N` additive, `v2` breaking) recorded in checkpoint §7.

    **Amendment v1.1** (labelled `v1.1-P4` on the P4 branch; additive, checkpoint §7 A-P4-01, P4 2026-11-20): the `performance` tag —
    review cycles, reviews, goals and the rating distribution (PKG_PERFORMANCE, HRMS_PERFORMANCE).
    No v1 route, schema, error code or status changed. HRMS_PERFORMANCE had no permission check, so
    these routes need only authentication unless `x-permission` says otherwise; review and goal rows
    are scoped to the reviewed employee and the assigned reviewer (OQ-09), PERFORMANCE:VIEW holders
    may read every review. The coordinator renumbers this amendment when P4 and P5 are merged.

    **Amendment v1.2 (labelled `v1.1-P5` on the P5 branch; additive, P5 employee core):** `POST /api/v1/employees`,
    `PATCH`/`DELETE /api/v1/employees/{empId}` (DELETE always 405 `DELETE_FORBIDDEN`),
    `POST /api/v1/employees/{empId}/{transfer,promote,terminate,rehire}`,
    `GET /api/v1/employees/{empId}/history`; schemas for those bodies and `EmployeeMutation` with
    `warnings[]` (OQ-11); error code `EMPLOYEE_NOT_TERMINATED` (409). Nothing in v1 changed. P4
    numbers its parallel amendment `v1.1-P4`; the coordinator reconciles the numbering on merge.

    **Amendment v1.3 (labelled `v1.2-P6` on the P6 branch; additive, P6 payroll):** 13 operations under `/api/v1/payroll` (pay periods:
    list, get, generate, close; runs: list, create, get, calculate, approve, reverse, payslips,
    errors; employee salary records) and their schemas. No new error code: the payroll codes
    (`INVALID_SALARY`, `PERIOD_CLOSED`, `INVALID_RUN_STATUS`, `NO_ACTIVE_SALARY`) were catalogued
    in v1. Nothing in v1 or v1.1-P5 changed.

    **Renumbering (checkpoint §7 A-P7-00, P7 2026-11-20):** P4 and P5 amended v1 in parallel, so the
    branch labels `v1.1-P4`, `v1.1-P5` and `v1.2-P6` became the linear versions `v1.1` (P4), `v1.2`
    (P5) and `v1.3` (P6) when P7 merged P4 into the P6 line. Only the labels changed; each
    amendment's content is as written above.

    **Amendment v1.4 (additive, checkpoint §7 A-P7-01, P7 navigation + reporting):** the `reports`
    tag — `GET /api/v1/reports` (catalogue) and `GET /api/v1/reports/{pending-approvals,
    leave-summary,org-hierarchy,employee-compensation,payroll-latest}` over VW_PENDING_APPROVALS,
    VW_LEAVE_SUMMARY, VW_ORG_HIERARCHY, VW_EMPLOYEE_COMPENSATION and VW_PAYROLL_LATEST, all behind
    REPORTS:VIEW (OQ-03); compensation and payroll figures also need PAYROLL:VIEW. `MenuEntry` gains
    the optional navigation targets `route` and `apiPath`. No new error code; nothing in v1–v1.3
    changed. The other PKG_REPORTING reports and the pay register stay deferred (OQ-03).

    Authentication: `POST /api/v1/auth/login` returns an opaque bearer token (256-bit, only its
    SHA-256 is stored). Sessions expire 30 minutes after login (absolute, OQ-08). Five consecutive
    failed logins lock the credential for 15 minutes (OQ-07). Every other route needs
    `Authorization: Bearer <token>`.

    Errors are RFC 9457 `application/problem+json` with `code`, `legacyCode` and `traceId` (D-05).
    `ErrorCode` is the complete, stable catalogue for every phase; each code has exactly one HTTP
    status (A-P3-02). `x-permission` names the module:action authority a route needs (D-06 matrix);
    leave rows are additionally scoped to the caller (OQ-09).

    Dates (`format: date`) are calendar dates; "today" is the UTC date of the server clock.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: menu
  - name: employees
  - name: lookups
  - name: leave
  - name: payroll
  - name: performance
  - name: reports
paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate by work email (replaces PKG_SECURITY.authenticate, HRMS_LOGIN)
      description: |
        Identity is the ACTIVE employee whose email matches case-insensitively; duplicates resolve
        to the lowest emp_id (OQ-06). Unknown user, wrong password, inactive employee, missing
        credential and locked credential all return the same 401 `INVALID_CREDENTIALS`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: INVALID_CREDENTIALS (legacy -20301)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session (replaces PKG_SECURITY.logout)
      responses:
        '204': { description: 'Session closed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: currentUser
      summary: Current principal and its permissions (replaces the HRMS_LOGIN globals)
      responses:
        '200':
          description: The signed-in employee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change own password (PKG_SECURITY.change_password, implemented for real)
      description: |
        Policy, checked in legacy order: at least 8 characters (-20310), an uppercase letter
        (-20311), a digit (-20312); at most 72 UTF-8 bytes. On success the caller's other sessions
        are closed; the current session stays valid.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: 'Password changed' }
        '400':
          description: PASSWORD_POLICY (legacy -20310/-20311/-20312) or VALIDATION_FAILED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: INVALID_CURRENT_PASSWORD
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/menu:
    get:
      tags: [menu]
      operationId: menu
      summary: HRMS_MENU entries with their permission gates
      description: |
        Employee, Leave and Performance are enabled for every authenticated user (FRM-014 parity);
        Payroll needs PAYROLL:VIEW and Reports needs REPORTS:VIEW. System Admin is not returned
        (OQ-03); its only kept function is Change Password under `account`. Since v1.4 each entry
        carries its navigation target: `route` (client route, null for the Logout action) and
        `apiPath` (the API entry point the screen uses).
      responses:
        '200':
          description: Menu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/employees:
    get:
      tags: [employees]
      operationId: searchEmployees
      summary: Search employees (parameterized replacement for PKG_EMPLOYEE.search_employees)
      description: |
        Active-only by default (`employment_status = 'ACTIVE' AND active_flag`). Name filters are
        case-insensitive prefix matches; wildcard characters are literal. Ordered by last name,
        first name, emp_id.
      x-permission: EMPLOYEE:VIEW
      parameters:
        - { name: lastName, in: query, schema: { type: string } }
        - { name: firstName, in: query, schema: { type: string } }
        - { name: deptId, in: query, schema: { type: integer, format: int64 } }
        - { name: managerEmpId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EmploymentStatus' } }
        - { name: locationCode, in: query, schema: { type: string } }
        - { name: hireDateFrom, in: query, schema: { type: string, format: date } }
        - { name: hireDateTo, in: query, schema: { type: string, format: date } }
        - { name: includeInactive, in: query, schema: { type: boolean, default: false } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page of employees
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [employees]
      operationId: createEmployee
      summary: Hire an employee (PKG_EMPLOYEE.create_employee + TRG_EMP_BEFORE_INSERT) — v1.1-P5
      description: |
        Check order (legacy): first and last name (400, legacy -20010), field formats (email,
        phones, date of birth not in the future; 400), active department (INVALID_DEPARTMENT),
        ACTIVE manager (INVALID_MANAGER), active job (INVALID_JOB), salary > 0 (INVALID_SALARY), hire
        date at most 180 days ahead (HIRE_DATE_TOO_FAR, OQ-10), email unused among active employees
        (EMAIL_IN_USE). Names are stored upper-case, email lower-case. `empNumber` comes from a
        sequence (EMP-NNNNNN). Location defaults to the department's. A salary outside the job
        grade's range is a `warnings[]` entry, never an error (OQ-11). The salary record is handed
        to the compensation port (OQ-01). Writes a HIRE history row, an INSERT audit row, a welcome
        notification and, with a manager, a direct-report notification.
      x-permission: EMPLOYEE:EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEmployeeRequest' }
      responses:
        '201':
          description: The employee after the change, plus non-blocking warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeMutation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: EMAIL_IN_USE (-20502) or EMP_NUMBER_CONFLICT (-20002)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: INVALID_DEPARTMENT (-20003), INVALID_MANAGER (-20004), INVALID_JOB (-20011), INVALID_SALARY (-20101), HIRE_DATE_TOO_FAR (-20501)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/employees/{empId}:
    get:
      tags: [employees]
      operationId: getEmployee
      summary: One employee (active-only unless includeInactive=true)
      x-permission: EMPLOYEE:VIEW
      parameters:
        - { name: empId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: includeInactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Employee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeView' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: EMPLOYEE_NOT_FOUND (legacy -20001)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    patch:
      tags: [employees]
      operationId: updateEmployee
      summary: Partial update of names and contact details (PKG_EMPLOYEE.update_employee) — v1.1-P5
      description: |
        Absent or null fields are unchanged; a blank name is 400. Department, job, manager, status
        and pay change only through the commands below; `empId`, `empNumber` and audit columns are
        never writable (FRM-038). Works for any status, as in legacy.
      x-permission: EMPLOYEE:EDIT
      parameters:
        - { name: empId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEmployeeRequest' }
      responses:
        '200':
          description: The employee after the change, plus non-blocking warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeMutation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: EMPLOYEE_NOT_FOUND (-20001)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: EMAIL_IN_USE (-20502)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [employees]
      operationId: deleteEmployee
      summary: Always refused — employees are never physically deleted (TRG-008, D-03) — v1.1-P5
      x-permission: EMPLOYEE:VIEW
      parameters:
        - { name: empId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '405':
          description: DELETE_FORBIDDEN (-20504); use terminate
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/employees/{empId}/transfer:
    post:
      tags: [employees]
      operationId: transferEmployee
      summary: Transfer (PKG_EMPLOYEE.transfer_employee) — v1.1-P5
      description: |
        The row is locked NOWAIT (a held lock is 409 CONCURRENT_MODIFICATION). The employee must be
        ACTIVE (EMPLOYEE_NOT_ACTIVE, legacy -20012). Job, manager and location default to the current
        values. A new manager must be ACTIVE and must not create a reporting cycle within 15 levels
        (CIRCULAR_REPORTING). Writes a TRANSFER history row.
      x-permission: EMPLOYEE:EDIT
      parameters:
        - { name: empId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '200':
          description: The employee after the change, plus non-blocking warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeMutation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: EMPLOYEE_NOT_FOUND (-20001)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: CONCURRENT_MODIFICATION
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: EMPLOYEE_NOT_ACTIVE, INVALID_DEPARTMENT, INVALID_JOB, INVALID_MANAGER, CIRCULAR_REPORTING
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/employees/{empId}/promote:
    post:
      tags: [employees]
      operationId: promoteEmployee
      summary: Promote (PKG_EMPLOYEE.promote_employee) — v1.1-P5
      description: |
        The employee must be ACTIVE and the job active (both new checks). The new salary goes to the
        compensation port as PROMOTION, with the change percentage when a current salary is known.
        Outside the grade range is a warning (OQ-11). Writes a PROMOTION history row.
      x-permission: EMPLOYEE:EDIT
      parameters:
        - { name: empId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoteRequest' }
      responses:
        '200':
          description: The employee after the change, plus non-blocking warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeMutation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: EMPLOYEE_NOT_FOUND (-20001)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: EMPLOYEE_NOT_ACTIVE, INVALID_JOB, INVALID_SALARY
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/employees/{empId}/terminate:
    post:
      tags: [employees]
      operationId: terminateEmployee
      summary: Terminate (PKG_EMPLOYEE.terminate_employee) — v1.1-P5
      description: |
        Rejects an already TERMINATED employee (ALREADY_TERMINATED, -20005). Cancels every PENDING leave
        request through the leave cancel transition, which releases the pending balance (DEF-22). Sets
        TERMINATED, the termination date and reason, and `active = false`; ends compensation through the
        port; writes a TERMINATION history row and a STATUS_CHANGE audit row; notifies the manager.
      x-permission: EMPLOYEE:EDIT
      parameters:
        - { name: empId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TerminateRequest' }
      responses:
        '200':
          description: The employee after the change, plus non-blocking warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeMutation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: EMPLOYEE_NOT_FOUND (-20001)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: ALREADY_TERMINATED (-20005)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/employees/{empId}/rehire:
    post:
      tags: [employees]
      operationId: rehireEmployee
      summary: Rehire (PKG_EMPLOYEE.rehire_employee, fixed per DEF-13) — v1.1-P5
      description: |
        The only path from TERMINATED back to ACTIVE (TRG-006). The employee must be TERMINATED
        (EMPLOYEE_NOT_TERMINATED). Department, job and an optional manager are validated as on create;
        location defaults to the department's; the email must not be in use by another active employee.
        Hire date becomes the rehire date (legacy). Writes a REHIRE history row.
      x-permission: EMPLOYEE:EDIT
      parameters:
        - { name: empId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RehireRequest' }
      responses:
        '200':
          description: The employee after the change, plus non-blocking warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeMutation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: EMPLOYEE_NOT_FOUND (-20001)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: EMPLOYEE_NOT_TERMINATED or EMAIL_IN_USE (-20502)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: INVALID_DEPARTMENT, INVALID_JOB, INVALID_MANAGER, CIRCULAR_REPORTING, INVALID_SALARY
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/employees/{empId}/history:
    get:
      tags: [employees]
      operationId: employeeHistory
      summary: EMPLOYEE_HISTORY rows, oldest first (any status) — v1.1-P5
      x-permission: EMPLOYEE:EDIT
      parameters:
        - { name: empId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmployeeHistoryEntry' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: EMPLOYEE_NOT_FOUND (-20001)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/lookups/departments:
    get:
      tags: [lookups]
      operationId: listDepartments
      summary: Active departments (RG_DEPARTMENTS)
      x-permission: EMPLOYEE:VIEW
      responses:
        '200':
          description: Departments
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Department' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/lookups/job-titles:
    get:
      tags: [lookups]
      operationId: listJobTitles
      summary: Active job titles (RG_JOB_TITLES)
      x-permission: EMPLOYEE:VIEW
      responses:
        '200':
          description: Job titles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/JobTitle' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/lookups/locations:
    get:
      tags: [lookups]
      operationId: listLocations
      summary: Active locations (RG_LOCATIONS)
      x-permission: EMPLOYEE:VIEW
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Location' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/leave/types:
    get:
      tags: [leave]
      operationId: listLeaveTypes
      summary: Active leave types (FRM-054 LOV)
      x-permission: LEAVE:VIEW
      responses:
        '200':
          description: Active leave types
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LeaveType' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/leave/balances:
    get:
      tags: [leave]
      operationId: myLeaveBalances
      summary: The caller's leave balances for a calendar year (default the current year)
      x-permission: LEAVE:VIEW
      parameters:
        - { name: year, in: query, schema: { type: integer, minimum: 1900, maximum: 9999 } }
      responses:
        '200':
          description: Balances; `available` is net of `pending`
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LeaveBalance' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/leave/requests:
    get:
      tags: [leave]
      operationId: myLeaveRequests
      summary: The caller's own leave requests, newest first (FRM-050)
      x-permission: LEAVE:VIEW
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/LeaveStatus' } }
        - { name: year, in: query, description: Calendar year of the start date, schema: { type: integer, minimum: 1900, maximum: 9999 } }
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LeaveRequest' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [leave]
      operationId: submitLeaveRequest
      summary: Submit a leave request for the caller (replaces PKG_LEAVE.submit_leave_request)
      description: |
        Checks, in legacy order: employee ACTIVE (-20001), leave type active (-20203), MIN_TENURE_DAYS
        (-20203), start <= end (-20210), start at most 5 days in the past (-20211), half-day shape
        (DEF-01: `halfDayPeriod` required, start = end), business days > 0 (weekdays minus active
        holidays of NULL or the employee's location, -20212), no overlap with PENDING/APPROVED requests
        (AM and PM half days of one date do not overlap, -20202), and for accrual types the
        current-year available balance (-20201). Types with `requiresApproval = false` are created
        APPROVED and their days go straight to `used` (DEF-12); otherwise PENDING, the days go to
        `pending` and the manager (the request's approver) is notified.
      x-permission: LEAVE:CREATE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitLeaveRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }
  /api/v1/leave/requests/{requestId}:
    get:
      tags: [leave]
      operationId: getLeaveRequest
      summary: One request, visible to its owner, its approver and LEAVE:APPROVE holders (else 404)
      x-permission: LEAVE:VIEW
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/leave/requests/{requestId}/approve:
    post:
      tags: [leave]
      operationId: approveLeaveRequest
      summary: Approve a PENDING request (PENDING → APPROVED, days pending → used, employee notified)
      description: Allowed for the assigned approver or a LEAVE:APPROVE holder, never for the requester (403).
      x-permission: LEAVE:VIEW + assigned approver or LEAVE:APPROVE
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveDecision' }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/leave/requests/{requestId}/reject:
    post:
      tags: [leave]
      operationId: rejectLeaveRequest
      summary: Reject a PENDING request (PENDING → REJECTED, pending released, employee notified)
      description: Same authorization as approve.
      x-permission: LEAVE:VIEW + assigned approver or LEAVE:APPROVE
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveDecision' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/leave/requests/{requestId}/cancel:
    post:
      tags: [leave]
      operationId: cancelLeaveRequest
      summary: Cancel a PENDING or APPROVED request (FRM-051 gate, server-side)
      description: |
        Owner or LEAVE:ADMIN only. PENDING releases `pending`; APPROVED restores `used`. Any other
        status is 409 `INVALID_REQUEST_STATUS` (-20204). No notification (PKG-L02 parity).
      x-permission: LEAVE:VIEW + owner or LEAVE:ADMIN
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelLeaveRequest' }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/leave/approvals:
    get:
      tags: [leave]
      operationId: myPendingApprovals
      summary: PENDING requests assigned to the caller, oldest first (FRM-056, get_pending_requests)
      x-permission: LEAVE:VIEW
      responses:
        '200':
          description: Requests awaiting the caller
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LeaveRequest' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/leave/team-calendar:
    get:
      tags: [leave]
      operationId: teamCalendar
      summary: APPROVED/TAKEN leave of the caller's direct reports in [from, to] (FRM-056, get_team_calendar)
      x-permission: LEAVE:VIEW
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Calendar entries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TeamCalendarEntry' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/leave/accrual-runs:
    post:
      tags: [leave]
      operationId: runMonthlyAccrual
      summary: Run the monthly accrual for the month of accrualDate (PKG_LEAVE.run_monthly_accrual)
      description: |
        Idempotent per calendar month: the first call returns 201, later calls for the same month
        return 200 with the existing run and accrue nothing. The scheduled job (1st of the month,
        `hrms.jobs.enabled=true`) uses the same service.
      x-permission: LEAVE:ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccrualRunRequest' }
      responses:
        '201':
          description: Run created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccrualRun' }
        '200':
          description: The month was already accrued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccrualRun' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/payroll/pay-periods:
    get:
      tags: [payroll]
      operationId: listPayPeriods
      summary: Pay periods, newest start first; OPEN only unless status is given (FRM-061)
      x-permission: PAYROLL:VIEW
      parameters:
        - { name: status, in: query, description: Default OPEN, schema: { $ref: '#/components/schemas/PayPeriodStatus' } }
        - { name: frequency, in: query, schema: { $ref: '#/components/schemas/PayFrequency' } }
        - { name: year, in: query, description: Calendar year of the pay date, schema: { type: integer, minimum: 1900, maximum: 9999 } }
      responses:
        '200':
          description: Periods
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PayPeriod' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/payroll/pay-periods/{periodId}:
    get:
      tags: [payroll]
      operationId: getPayPeriod
      summary: One pay period
      x-permission: PAYROLL:VIEW
      parameters:
        - $ref: '#/components/parameters/PeriodId'
      responses:
        '200':
          description: Period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayPeriod' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/payroll/pay-periods/generate:
    post:
      tags: [payroll]
      operationId: generatePayPeriods
      summary: Generate a year of MONTHLY or BIWEEKLY periods (PKG_PAYROLL.create_pay_periods)
      description: |
        MONTHLY: calendar months; pay date = last day, moved to Friday from Saturday (-1) or Sunday (-2);
        name `YYYY-MM (Mon)`. BIWEEKLY: the first period ends on the year's first Friday, 14-day periods
        while the start is in the year, pay date = end + 5, name `YYYY-BW-NN`. Other frequencies are 400.
        Idempotent: a period overlapping an existing period of the same frequency is skipped (DEF-P6-3);
        201 when at least one period was created, else 200.
      x-permission: PAYROLL:EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeneratePayPeriodsRequest' }
      responses:
        '201':
          description: Periods created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayPeriodGeneration' }
        '200':
          description: Nothing new to create
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayPeriodGeneration' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/payroll/pay-periods/{periodId}/close:
    post:
      tags: [payroll]
      operationId: closePayPeriod
      summary: Close a period (PKG_PAYROLL.close_pay_period); an already CLOSED period is PERIOD_CLOSED (-20102)
      x-permission: PAYROLL:EDIT
      parameters:
        - $ref: '#/components/parameters/PeriodId'
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayPeriod' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PayrollConflict' }
  /api/v1/payroll/runs:
    get:
      tags: [payroll]
      operationId: listPayrollRuns
      summary: Payroll runs, newest first
      x-permission: PAYROLL:VIEW
      parameters:
        - { name: periodId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PayrollRunStatus' } }
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PayrollRun' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [payroll]
      operationId: createPayrollRun
      summary: Create a PENDING run for a period that is not CLOSED (PKG_PAYROLL.create_payroll_run)
      x-permission: PAYROLL:EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePayrollRunRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRun' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PayrollConflict' }
  /api/v1/payroll/runs/{runId}:
    get:
      tags: [payroll]
      operationId: getPayrollRun
      summary: One run with its totals
      x-permission: PAYROLL:VIEW
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRun' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/payroll/runs/{runId}/calculate:
    post:
      tags: [payroll]
      operationId: calculatePayrollRun
      summary: Calculate a PENDING run (PKG_PAYROLL.calculate_payroll) → CALCULATED, or ERROR when an employee failed
      description: |
        FRM-062: only a PENDING run (else 409 `INVALID_RUN_STATUS`, `legacyCode` null). Every employee with
        `employmentStatus = ACTIVE` and `active = true`: gross = annual salary on the period end / periods
        per year; federal, state, Social Security and Medicare tax from the configured tables (DEF-05);
        DEDUCTION/BENEFIT pay elements. One transaction (DEF-16). An employee without a salary is recorded
        as an error (`NO_ACTIVE_SALARY`, see `/errors`) and the run becomes ERROR. A run locked by another
        calculation is 409 `CONCURRENT_MODIFICATION`.
      x-permission: PAYROLL:EDIT
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Calculated (status CALCULATED or ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRun' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PayrollConflict' }
  /api/v1/payroll/runs/{runId}/approve:
    post:
      tags: [payroll]
      operationId: approvePayrollRun
      summary: Approve a CALCULATED run (PKG_PAYROLL.approve_payroll; other statuses are INVALID_RUN_STATUS -20103)
      x-permission: PAYROLL:APPROVE
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRun' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PayrollConflict' }
  /api/v1/payroll/runs/{runId}/reverse:
    post:
      tags: [payroll]
      operationId: reversePayrollRun
      summary: Reverse a CALCULATED, APPROVED, PAID or ERROR run (PKG_PAYROLL.reverse_payroll, DEF-21)
      description: The run and its details become REVERSED and no longer count towards year-to-date. The reason is audited.
      x-permission: PAYROLL:APPROVE
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReversePayrollRequest' }
      responses:
        '200':
          description: Reversed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRun' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PayrollConflict' }
  /api/v1/payroll/runs/{runId}/payslips:
    get:
      tags: [payroll]
      operationId: listPayslips
      summary: Payslips of a run (PKG_PAYROLL.get_payslip), ordered by last name, with year-to-date totals (DEF-06)
      x-permission: PAYROLL:VIEW
      parameters:
        - $ref: '#/components/parameters/RunId'
        - { name: empId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Payslips
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Payslip' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/payroll/runs/{runId}/errors:
    get:
      tags: [payroll]
      operationId: listPayrollRunErrors
      summary: Per-employee calculation errors of a run
      x-permission: PAYROLL:VIEW
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Errors
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PayrollRunError' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/payroll/employees/{empId}/salary-records:
    get:
      tags: [payroll]
      operationId: listSalaryRecords
      summary: An employee's salary history, newest first (read-only, FRM-039)
      description: Salary records change only through hire, promote, rehire and terminate (`SalaryRecordPort`).
      x-permission: PAYROLL:VIEW
      parameters:
        - { name: empId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Salary records
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SalaryRecord' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/performance/cycles:
    get:
      tags: [performance]
      operationId: listReviewCycles
      summary: Review cycles, OPEN and DRAFT only unless includeClosed, newest cycleYear first (FRM-070)
      parameters:
        - { name: includeClosed, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Cycles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReviewCycle' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [performance]
      operationId: createReviewCycle
      summary: Create a cycle in DRAFT (create_review_cycle); endDate must not precede startDate
      x-permission: PERFORMANCE:ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewCycle' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCycle' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/performance/cycles/{cycleId}:
    get:
      tags: [performance]
      operationId: getReviewCycle
      summary: One cycle
      parameters:
        - $ref: '#/components/parameters/CycleId'
      responses:
        '200':
          description: Cycle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCycle' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [performance]
      operationId: deleteReviewCycle
