openapi: 3.0.3
info:
  title: HRMS API
  version: 1.1.0
  x-contract-version: v1.1-P4
  description: |
    **Frozen contract v1** (checkpoint §3 and §7, frozen by P3 on 2026-11-20). P2 authored auth,
    sessions, permission matrix, menu backend, change-password and the employee read model; P3 added
    the leave pilot and froze the file. Any change to a route, schema, error code or status from
    here on is a versioned amendment (`v1.N` additive, `v2` breaking) recorded in checkpoint §7.

    Authentication: `POST /api/v1/auth/login` returns an opaque bearer token (256-bit, only its
    SHA-256 is stored). Sessions expire 30 minutes after login (absolute, OQ-08). Five consecutive
    failed logins lock the credential for 15 minutes (OQ-07). Every other route needs
    `Authorization: Bearer <token>`.

    Errors are RFC 9457 `application/problem+json` with `code`, `legacyCode` and `traceId` (D-05).
    `ErrorCode` is the complete, stable catalogue for every phase; each code has exactly one HTTP
    status (A-P3-02). `x-permission` names the module:action authority a route needs (D-06 matrix);
    leave rows are additionally scoped to the caller (OQ-09).

    **Amendment v1.1-P4** (additive, checkpoint §7 A-P4-01, P4 2026-11-20): the `performance` tag —
    review cycles, reviews, goals and the rating distribution (PKG_PERFORMANCE, HRMS_PERFORMANCE).
    No v1 route, schema, error code or status changed. HRMS_PERFORMANCE had no permission check, so
    these routes need only authentication unless `x-permission` says otherwise; review and goal rows
    are scoped to the reviewed employee and the assigned reviewer (OQ-09), PERFORMANCE:VIEW holders
    may read every review. The coordinator renumbers this amendment when P4 and P5 are merged.

    Dates (`format: date`) are calendar dates; "today" is the UTC date of the server clock.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: menu
  - name: employees
  - name: lookups
  - name: leave
  - name: performance
paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate by work email (replaces PKG_SECURITY.authenticate, HRMS_LOGIN)
      description: |
        Identity is the ACTIVE employee whose email matches case-insensitively; duplicates resolve
        to the lowest emp_id (OQ-06). Unknown user, wrong password, inactive employee, missing
        credential and locked credential all return the same 401 `INVALID_CREDENTIALS`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: INVALID_CREDENTIALS (legacy -20301)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session (replaces PKG_SECURITY.logout)
      responses:
        '204': { description: 'Session closed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: currentUser
      summary: Current principal and its permissions (replaces the HRMS_LOGIN globals)
      responses:
        '200':
          description: The signed-in employee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change own password (PKG_SECURITY.change_password, implemented for real)
      description: |
        Policy, checked in legacy order: at least 8 characters (-20310), an uppercase letter
        (-20311), a digit (-20312); at most 72 UTF-8 bytes. On success the caller's other sessions
        are closed; the current session stays valid.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: 'Password changed' }
        '400':
          description: PASSWORD_POLICY (legacy -20310/-20311/-20312) or VALIDATION_FAILED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: INVALID_CURRENT_PASSWORD
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/menu:
    get:
      tags: [menu]
      operationId: menu
      summary: HRMS_MENU entries with their permission gates
      description: |
        Employee, Leave and Performance are enabled for every authenticated user (FRM-014 parity);
        Payroll needs PAYROLL:VIEW and Reports needs REPORTS:VIEW. System Admin is not returned
        (OQ-03). Navigation targets are defined in P7.
      responses:
        '200':
          description: Menu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/employees:
    get:
      tags: [employees]
      operationId: searchEmployees
      summary: Search employees (parameterized replacement for PKG_EMPLOYEE.search_employees)
      description: |
        Active-only by default (`employment_status = 'ACTIVE' AND active_flag`). Name filters are
        case-insensitive prefix matches; wildcard characters are literal. Ordered by last name,
        first name, emp_id.
      x-permission: EMPLOYEE:VIEW
      parameters:
        - { name: lastName, in: query, schema: { type: string } }
        - { name: firstName, in: query, schema: { type: string } }
        - { name: deptId, in: query, schema: { type: integer, format: int64 } }
        - { name: managerEmpId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EmploymentStatus' } }
        - { name: locationCode, in: query, schema: { type: string } }
        - { name: hireDateFrom, in: query, schema: { type: string, format: date } }
        - { name: hireDateTo, in: query, schema: { type: string, format: date } }
        - { name: includeInactive, in: query, schema: { type: boolean, default: false } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page of employees
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/employees/{empId}:
    get:
      tags: [employees]
      operationId: getEmployee
      summary: One employee (active-only unless includeInactive=true)
      x-permission: EMPLOYEE:VIEW
      parameters:
        - { name: empId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: includeInactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Employee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeView' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: EMPLOYEE_NOT_FOUND (legacy -20001)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/lookups/departments:
    get:
      tags: [lookups]
      operationId: listDepartments
      summary: Active departments (RG_DEPARTMENTS)
      x-permission: EMPLOYEE:VIEW
      responses:
        '200':
          description: Departments
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Department' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/lookups/job-titles:
    get:
      tags: [lookups]
      operationId: listJobTitles
      summary: Active job titles (RG_JOB_TITLES)
      x-permission: EMPLOYEE:VIEW
      responses:
        '200':
          description: Job titles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/JobTitle' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/lookups/locations:
    get:
      tags: [lookups]
      operationId: listLocations
      summary: Active locations (RG_LOCATIONS)
      x-permission: EMPLOYEE:VIEW
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Location' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/leave/types:
    get:
      tags: [leave]
      operationId: listLeaveTypes
      summary: Active leave types (FRM-054 LOV)
      x-permission: LEAVE:VIEW
      responses:
        '200':
          description: Active leave types
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LeaveType' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/leave/balances:
    get:
      tags: [leave]
      operationId: myLeaveBalances
      summary: The caller's leave balances for a calendar year (default the current year)
      x-permission: LEAVE:VIEW
      parameters:
        - { name: year, in: query, schema: { type: integer, minimum: 1900, maximum: 9999 } }
      responses:
        '200':
          description: Balances; `available` is net of `pending`
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LeaveBalance' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/leave/requests:
    get:
      tags: [leave]
      operationId: myLeaveRequests
      summary: The caller's own leave requests, newest first (FRM-050)
      x-permission: LEAVE:VIEW
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/LeaveStatus' } }
        - { name: year, in: query, description: Calendar year of the start date, schema: { type: integer, minimum: 1900, maximum: 9999 } }
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LeaveRequest' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [leave]
      operationId: submitLeaveRequest
      summary: Submit a leave request for the caller (replaces PKG_LEAVE.submit_leave_request)
      description: |
        Checks, in legacy order: employee ACTIVE (-20001), leave type active (-20203), MIN_TENURE_DAYS
        (-20203), start <= end (-20210), start at most 5 days in the past (-20211), half-day shape
        (DEF-01: `halfDayPeriod` required, start = end), business days > 0 (weekdays minus active
        holidays of NULL or the employee's location, -20212), no overlap with PENDING/APPROVED requests
        (AM and PM half days of one date do not overlap, -20202), and for accrual types the
        current-year available balance (-20201). Types with `requiresApproval = false` are created
        APPROVED and their days go straight to `used` (DEF-12); otherwise PENDING, the days go to
        `pending` and the manager (the request's approver) is notified.
      x-permission: LEAVE:CREATE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitLeaveRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }
  /api/v1/leave/requests/{requestId}:
    get:
      tags: [leave]
      operationId: getLeaveRequest
      summary: One request, visible to its owner, its approver and LEAVE:APPROVE holders (else 404)
      x-permission: LEAVE:VIEW
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/leave/requests/{requestId}/approve:
    post:
      tags: [leave]
      operationId: approveLeaveRequest
      summary: Approve a PENDING request (PENDING → APPROVED, days pending → used, employee notified)
      description: Allowed for the assigned approver or a LEAVE:APPROVE holder, never for the requester (403).
      x-permission: LEAVE:VIEW + assigned approver or LEAVE:APPROVE
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveDecision' }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/leave/requests/{requestId}/reject:
    post:
      tags: [leave]
      operationId: rejectLeaveRequest
      summary: Reject a PENDING request (PENDING → REJECTED, pending released, employee notified)
      description: Same authorization as approve.
      x-permission: LEAVE:VIEW + assigned approver or LEAVE:APPROVE
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveDecision' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/leave/requests/{requestId}/cancel:
    post:
      tags: [leave]
      operationId: cancelLeaveRequest
      summary: Cancel a PENDING or APPROVED request (FRM-051 gate, server-side)
      description: |
        Owner or LEAVE:ADMIN only. PENDING releases `pending`; APPROVED restores `used`. Any other
        status is 409 `INVALID_REQUEST_STATUS` (-20204). No notification (PKG-L02 parity).
      x-permission: LEAVE:VIEW + owner or LEAVE:ADMIN
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelLeaveRequest' }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/leave/approvals:
    get:
      tags: [leave]
      operationId: myPendingApprovals
      summary: PENDING requests assigned to the caller, oldest first (FRM-056, get_pending_requests)
      x-permission: LEAVE:VIEW
      responses:
        '200':
          description: Requests awaiting the caller
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LeaveRequest' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/leave/team-calendar:
    get:
      tags: [leave]
      operationId: teamCalendar
      summary: APPROVED/TAKEN leave of the caller's direct reports in [from, to] (FRM-056, get_team_calendar)
      x-permission: LEAVE:VIEW
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Calendar entries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TeamCalendarEntry' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/leave/accrual-runs:
    post:
      tags: [leave]
      operationId: runMonthlyAccrual
      summary: Run the monthly accrual for the month of accrualDate (PKG_LEAVE.run_monthly_accrual)
      description: |
        Idempotent per calendar month: the first call returns 201, later calls for the same month
        return 200 with the existing run and accrue nothing. The scheduled job (1st of the month,
        `hrms.jobs.enabled=true`) uses the same service.
      x-permission: LEAVE:ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccrualRunRequest' }
      responses:
        '201':
          description: Run created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccrualRun' }
        '200':
          description: The month was already accrued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccrualRun' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/performance/cycles:
    get:
      tags: [performance]
      operationId: listReviewCycles
      summary: Review cycles, OPEN and DRAFT only unless includeClosed, newest cycleYear first (FRM-070)
      parameters:
        - { name: includeClosed, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Cycles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReviewCycle' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [performance]
      operationId: createReviewCycle
      summary: Create a cycle in DRAFT (create_review_cycle); endDate must not precede startDate
      x-permission: PERFORMANCE:ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewCycle' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCycle' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/performance/cycles/{cycleId}:
    get:
      tags: [performance]
      operationId: getReviewCycle
      summary: One cycle
      parameters:
        - $ref: '#/components/parameters/CycleId'
      responses:
        '200':
          description: Cycle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCycle' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [performance]
      operationId: deleteReviewCycle
      summary: Always 405 DELETE_FORBIDDEN, cycles are never deleted (FRM-071)
      parameters:
        - $ref: '#/components/parameters/CycleId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '405': { $ref: '#/components/responses/DeleteForbidden' }
  /api/v1/performance/cycles/{cycleId}/open:
    post:
      tags: [performance]
      operationId: openReviewCycle
      summary: DRAFT → OPEN, else 409 INVALID_CYCLE_STATUS (-20401)
      x-permission: PERFORMANCE:ADMIN
      parameters:
        - $ref: '#/components/parameters/CycleId'
      responses:
        '200':
          description: Opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCycle' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PerformanceConflict' }
  /api/v1/performance/cycles/{cycleId}/close:
    post:
      tags: [performance]
      operationId: closeReviewCycle
      summary: OPEN (or legacy IN_PROGRESS/CALIBRATION) → CLOSED, else 409 INVALID_CYCLE_STATUS (-20401, DEF-21)
      x-permission: PERFORMANCE:ADMIN
      parameters:
        - $ref: '#/components/parameters/CycleId'
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCycle' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PerformanceConflict' }
  /api/v1/performance/cycles/{cycleId}/reviews/generate:
    post:
      tags: [performance]
      operationId: generateReviews
      summary: One ANNUAL NOT_STARTED review per ACTIVE employee with a manager, reviewed by that manager; existing reviews are skipped (generate_reviews_for_cycle)
      x-permission: PERFORMANCE:ADMIN
      parameters:
        - $ref: '#/components/parameters/CycleId'
      responses:
        '200':
          description: Generation summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateReviewsResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/performance/cycles/{cycleId}/reviews:
    get:
      tags: [performance]
      operationId: listCycleReviews
      summary: Every review of the cycle by employee last name (HR view)
      x-permission: PERFORMANCE:VIEW
      parameters:
        - $ref: '#/components/parameters/CycleId'
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/ReviewStatus' } }
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PerformanceReview' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/performance/cycles/{cycleId}/rating-distribution:
    get:
      tags: [performance]
      operationId: ratingDistribution
      summary: Rated reviews of the cycle per label, best first, optionally for one department (get_rating_distribution)
      x-permission: PERFORMANCE:VIEW
      parameters:
        - $ref: '#/components/parameters/CycleId'
        - { name: deptId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Distribution
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RatingBucket' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/performance/reviews:
    get:
      tags: [performance]
      operationId: myReviews
      summary: The caller's own reviews (role EMPLOYEE), or the reviews assigned to the caller (role REVIEWER, get_team_reviews)
      parameters:
        - { name: role, in: query, required: false, schema: { allOf: [{ $ref: '#/components/schemas/ReviewRole' }], default: EMPLOYEE } }
        - { name: cycleId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PerformanceReview' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/performance/reviews/{reviewId}:
    get:
      tags: [performance]
      operationId: getPerformanceReview
      summary: One review, visible to its employee, its reviewer and PERFORMANCE:VIEW holders (else 404)
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceReview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [performance]
      operationId: deletePerformanceReview
      summary: Always 405 DELETE_FORBIDDEN, reviews are never deleted (FRM-072)
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '405': { $ref: '#/components/responses/DeleteForbidden' }
  /api/v1/performance/reviews/{reviewId}/self-assessment:
    post:
      tags: [performance]
      operationId: submitSelfAssessment
      summary: The reviewed employee only; NOT_STARTED/SELF_REVIEW → MANAGER_REVIEW, else 409 INVALID_REVIEW_STATUS (-20402); reviewer notified
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelfAssessment' }
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceReview' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PerformanceConflict' }
  /api/v1/performance/reviews/{reviewId}/manager-review:
    post:
      tags: [performance]
      operationId: submitManagerReview
      summary: The assigned reviewer only; MANAGER_REVIEW/MEETING_SCHEDULED → COMPLETED, else 409 INVALID_REVIEW_STATUS (-20402, DEF-21); employee notified
      description: |
        overallRating must be 1.0–5.0 with at most one decimal, else 400 INVALID_RATING (-20403).
        ratingLabel: ≥4.5 Exceptional, ≥3.5 Exceeds Expectations, ≥2.5 Meets Expectations,
        ≥1.5 Needs Improvement, else Unsatisfactory.
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagerReview' }
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceReview' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PerformanceConflict' }
  /api/v1/performance/reviews/{reviewId}/acknowledge:
    post:
      tags: [performance]
      operationId: acknowledgeReview
      summary: The reviewed employee only; COMPLETED → ACKNOWLEDGED, else 409 INVALID_REVIEW_STATUS (-20402; legacy was a silent no-op, DEF-21)
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Acknowledgement' }
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceReview' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PerformanceConflict' }
  /api/v1/performance/reviews/{reviewId}/goals:
    get:
      tags: [performance]
      operationId: listGoals
      summary: Goals of a review (same visibility as the review)
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Goals
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PerformanceGoal' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [performance]
      operationId: addGoal
      summary: The reviewed employee or the reviewer adds a NOT_STARTED goal at 0% for the review's employee (add_goal, FRM-075)
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddGoal' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceGoal' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/performance/goals/{goalId}:
    get:
      tags: [performance]
      operationId: getGoal
      summary: One goal (same visibility as its review)
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: Goal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceGoal' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [performance]
      operationId: deleteGoal
      summary: Always 405 DELETE_FORBIDDEN, goals are never deleted (FRM-074)
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '405': { $ref: '#/components/responses/DeleteForbidden' }
  /api/v1/performance/goals/{goalId}/progress:
    post:
      tags: [performance]
      operationId: updateGoalProgress
      summary: The reviewed employee or the reviewer sets progress 0–100, else 400 (DEF-21) (update_goal_progress)
      description: |
        status is the given one, else progressPct ≥ 100 → COMPLETED, > 0 → IN_PROGRESS, 0 → unchanged.
        comments are kept when omitted.
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalProgress' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceGoal' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token from /api/v1/auth/login
  parameters:
    RequestId: { name: requestId, in: path, required: true, schema: { type: integer, format: int64 } }
    CycleId: { name: cycleId, in: path, required: true, schema: { type: integer, format: int64 } }
    ReviewId: { name: reviewId, in: path, required: true, schema: { type: integer, format: int64 } }
    GoalId: { name: goalId, in: path, required: true, schema: { type: integer, format: int64 } }
  responses:
    NotFound:
      description: NOT_FOUND (unknown, or not visible to the caller)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: LEAVE_OVERLAP (-20202), INVALID_REQUEST_STATUS (-20204) or CONCURRENT_MODIFICATION
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BusinessRule:
      description: |
        422 business rule: EMPLOYEE_NOT_ACTIVE (-20001), INVALID_LEAVE_TYPE / MIN_TENURE_NOT_MET
        (-20203), BACKDATE_LIMIT_EXCEEDED (-20211), NO_BUSINESS_DAYS (-20212),
        INSUFFICIENT_LEAVE_BALANCE (-20201). INVALID_DATE_RANGE (-20210) is 400.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PerformanceConflict:
      description: INVALID_CYCLE_STATUS (-20401) or INVALID_REVIEW_STATUS (-20402)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DeleteForbidden:
      description: DELETE_FORBIDDEN (-20504), the resource is never deleted
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: UNAUTHENTICATED (missing, invalid, expired or revoked token)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: FORBIDDEN (permission matrix denies the route)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: VALIDATION_FAILED
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail with HRMS extensions (D-05)
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, example: 'urn:hrms:problem:INVALID_CREDENTIALS' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { $ref: '#/components/schemas/ErrorCode' }
        legacyCode: { type: integer, nullable: true, description: 'Oracle -20xxx number, when one exists' }
        traceId: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    ErrorCode:
      type: string
      description: |
        Complete v1 catalogue (D-05). HTTP status / legacy code: EMPLOYEE_NOT_FOUND 404/-20001,
        INVALID_CREDENTIALS 401/-20301, INVALID_CURRENT_PASSWORD 422, PASSWORD_POLICY 400,
        UNAUTHENTICATED 401, FORBIDDEN 403, VALIDATION_FAILED 400, NOT_FOUND 404,
        METHOD_NOT_ALLOWED 405, CONCURRENT_MODIFICATION 409, INTERNAL_ERROR 500,
        EMPLOYEE_NOT_ACTIVE 422/-20001, EMP_NUMBER_CONFLICT 409/-20002, INVALID_DEPARTMENT 422/-20003,
        INVALID_MANAGER 422/-20004, CIRCULAR_REPORTING 422/-20004, ALREADY_TERMINATED 409/-20005,
        INVALID_JOB 422/-20011, HIRE_DATE_TOO_FAR 422/-20501, EMAIL_IN_USE 409/-20502,
        REACTIVATION_FORBIDDEN 409/-20503, DELETE_FORBIDDEN 405/-20504, INVALID_SALARY 422/-20101,
        PERIOD_CLOSED 409/-20102, INVALID_RUN_STATUS 409/-20103, NO_ACTIVE_SALARY 422/-20104,
        INSUFFICIENT_LEAVE_BALANCE 422/-20201, LEAVE_OVERLAP 409/-20202, INVALID_LEAVE_TYPE 422/-20203,
        MIN_TENURE_NOT_MET 422/-20203, INVALID_REQUEST_STATUS 409/-20204, INVALID_DATE_RANGE 400/-20210,
        BACKDATE_LIMIT_EXCEEDED 422/-20211, NO_BUSINESS_DAYS 422/-20212, INVALID_CYCLE_STATUS 409/-20401,
        INVALID_REVIEW_STATUS 409/-20402, INVALID_RATING 400/-20403, PARAM_NOT_EDITABLE 409/-20900.
      enum: [EMPLOYEE_NOT_FOUND, INVALID_CREDENTIALS, INVALID_CURRENT_PASSWORD, PASSWORD_POLICY,
             UNAUTHENTICATED, FORBIDDEN, VALIDATION_FAILED, NOT_FOUND, METHOD_NOT_ALLOWED,
             CONCURRENT_MODIFICATION, INTERNAL_ERROR, EMPLOYEE_NOT_ACTIVE, EMP_NUMBER_CONFLICT,
             INVALID_DEPARTMENT, INVALID_MANAGER, CIRCULAR_REPORTING, ALREADY_TERMINATED, INVALID_JOB,
             HIRE_DATE_TOO_FAR, EMAIL_IN_USE, REACTIVATION_FORBIDDEN, DELETE_FORBIDDEN, INVALID_SALARY,
             PERIOD_CLOSED, INVALID_RUN_STATUS, NO_ACTIVE_SALARY, INSUFFICIENT_LEAVE_BALANCE,
             LEAVE_OVERLAP, INVALID_LEAVE_TYPE, MIN_TENURE_NOT_MET, INVALID_REQUEST_STATUS,
             INVALID_DATE_RANGE, BACKDATE_LIMIT_EXCEEDED, NO_BUSINESS_DAYS, INVALID_CYCLE_STATUS,
             INVALID_REVIEW_STATUS, INVALID_RATING, PARAM_NOT_EDITABLE]
    Module:
      type: string
      enum: [EMPLOYEE, PAYROLL, LEAVE, PERFORMANCE, REPORTS, ADMIN]
    Action:
      type: string
      enum: [VIEW, CREATE, EDIT, APPROVE, ADMIN]
    EmploymentStatus:
      type: string
      enum: [ACTIVE, ON_LEAVE, SUSPENDED, TERMINATED]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 100, description: 'Work email, case-insensitive' }
        password: { type: string, maxLength: 200, format: password }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken: { type: string, description: 'Opaque; send as `Authorization: Bearer <token>`' }
        tokenType: { type: string, enum: [Bearer] }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/CurrentUser' }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 200, format: password }
        newPassword: { type: string, maxLength: 200, format: password }
    CurrentUser:
      type: object
      required: [empId, empNumber, username, firstName, lastName, loginTime, expiresAt, permissions]
      properties:
        empId: { type: integer, format: int64 }
        empNumber: { type: string, example: EMP-000037 }
        username: { type: string, description: 'Lower-cased login email' }
        firstName: { type: string }
        lastName: { type: string }
        loginTime: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        permissions:
          type: object
          description: Granted actions per module; modules without any action are omitted
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/Action' }
          example: { EMPLOYEE: [VIEW], LEAVE: [VIEW, CREATE] }
    Menu:
      type: object
      required: [modules, account]
      properties:
        modules:
          type: array
          items: { $ref: '#/components/schemas/MenuEntry' }
        account:
          type: array
          items: { $ref: '#/components/schemas/MenuEntry' }
    MenuEntry:
      type: object
      required: [id, label, enabled]
      properties:
        id: { type: string, enum: [EMPLOYEES, PAYROLL, LEAVE, PERFORMANCE, REPORTS, CHANGE_PASSWORD, LOGOUT] }
        label: { type: string }
        module:
          allOf: [{ $ref: '#/components/schemas/Module' }]
          nullable: true
        enabled: { type: boolean }
    EmployeeView:
      type: object
      required: [empId, empNumber, firstName, lastName, employmentStatus, active, hireDate, deptId, deptName,
                 jobId, jobTitle]
      properties:
        empId: { type: integer, format: int64 }
        empNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, nullable: true }
        employmentStatus: { $ref: '#/components/schemas/EmploymentStatus' }
        employmentType: { type: string, nullable: true }
        active: { type: boolean, description: 'Soft-delete flag (ACTIVE_FLAG)' }
        hireDate: { type: string, format: date }
        managerEmpId: { type: integer, format: int64, nullable: true }
        managerName: { type: string, nullable: true }
        locationCode: { type: string, nullable: true }
        locationName: { type: string, nullable: true }
        deptId: { type: integer, format: int64 }
        deptName: { type: string }
        jobId: { type: integer, format: int64 }
        jobTitle: { type: string }
    EmployeePage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EmployeeView' }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    Department:
      type: object
      required: [deptId, deptCode, deptName]
      properties:
        deptId: { type: integer, format: int64 }
        deptCode: { type: string }
        deptName: { type: string }
        parentDeptId: { type: integer, format: int64, nullable: true }
        locationCode: { type: string, nullable: true }
    JobTitle:
      type: object
      required: [jobId, jobCode, jobTitle, gradeId]
      properties:
        jobId: { type: integer, format: int64 }
        jobCode: { type: string }
        jobTitle: { type: string }
        gradeId: { type: integer, format: int64 }
    Location:
      type: object
      required: [locationCode, locationName]
      properties:
        locationCode: { type: string }
        locationName: { type: string }
        city: { type: string, nullable: true }
        timezone: { type: string, nullable: true }
    LeaveStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED, TAKEN]
    HalfDayPeriod:
      type: string
      enum: [AM, PM]
    LeaveType:
      type: object
      properties:
        leaveTypeId: { type: integer, format: int64 }
        leaveTypeCode: { type: string }
        leaveTypeName: { type: string }
        paid: { type: boolean }
        accrual: { type: boolean, description: Balance-checked on submit and accrued monthly }
        accrualRate: { type: number, nullable: true }
        accrualFrequency: { type: string, nullable: true, enum: [MONTHLY, BIWEEKLY, ANNUAL] }
        maxBalance: { type: number, nullable: true }
        minTenureDays: { type: integer, nullable: true }
        requiresApproval: { type: boolean }
        requiresDocument: { type: boolean }
    LeaveBalance:
      type: object
      properties:
        leaveTypeId: { type: integer, format: int64 }
        leaveTypeCode: { type: string }
        leaveTypeName: { type: string }
        calendarYear: { type: integer }
        openingBalance: { type: number }
        accrued: { type: number }
        used: { type: number }
        adjustment: { type: number }
        pending: { type: number }
        available: { type: number, description: 'opening + accrued - used + adjustment - pending' }
        carryoverFromPrev: { type: number }
        carryoverExpiryDate: { type: string, format: date, nullable: true }
    LeaveRequest:
      type: object
      properties:
        requestId: { type: integer, format: int64 }
        empId: { type: integer, format: int64 }
        employeeName: { type: string }
        leaveTypeId: { type: integer, format: int64 }
        leaveTypeCode: { type: string }
        leaveTypeName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        totalDays: { type: number, description: Business days, or 0.5 for a half day }
        halfDay: { type: boolean }
        halfDayPeriod: { allOf: [{ $ref: '#/components/schemas/HalfDayPeriod' }], nullable: true }
        status: { $ref: '#/components/schemas/LeaveStatus' }
        reason: { type: string, nullable: true }
        approverEmpId: { type: integer, format: int64, nullable: true, description: 'The manager at submit; the decider after approve/reject' }
        approvalDate: { type: string, format: date-time, nullable: true }
        approvalComments: { type: string, nullable: true }
        cancelReason: { type: string, nullable: true }
        cancelledDate: { type: string, format: date-time, nullable: true }
        createdDate: { type: string, format: date-time }
    SubmitLeaveRequest:
      type: object
      required: [leaveTypeId, startDate, endDate]
      properties:
        leaveTypeId: { type: integer, format: int64 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        halfDay: { type: boolean, default: false }
        halfDayPeriod: { $ref: '#/components/schemas/HalfDayPeriod' }
        reason: { type: string, maxLength: 4000 }
    LeaveDecision:
      type: object
      properties:
        comments: { type: string, maxLength: 4000 }
    CancelLeaveRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 4000 }
    TeamCalendarEntry:
      type: object
      properties:
        requestId: { type: integer, format: int64 }
        empId: { type: integer, format: int64 }
        employeeName: { type: string }
        leaveTypeCode: { type: string }
        leaveTypeName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        totalDays: { type: number }
        status: { $ref: '#/components/schemas/LeaveStatus' }
        halfDay: { type: boolean }
        halfDayPeriod: { allOf: [{ $ref: '#/components/schemas/HalfDayPeriod' }], nullable: true }
    AccrualRunRequest:
      type: object
      required: [accrualDate]
      properties:
        accrualDate: { type: string, format: date }
    AccrualRun:
      type: object
      properties:
        runId: { type: integer, format: int64 }
        accrualPeriod: { type: string, format: date, description: First day of the accrued month }
        accrualDate: { type: string, format: date }
        employeesProcessed: { type: integer }
        entriesCreated: { type: integer }
        totalAccrued: { type: number }
        createdBy: { type: string }
        createdDate: { type: string, format: date-time }
    CycleStatus:
      type: string
      description: P4 drives DRAFT → OPEN → CLOSED; IN_PROGRESS and CALIBRATION exist only in legacy data
      enum: [DRAFT, OPEN, IN_PROGRESS, CALIBRATION, CLOSED]
    ReviewStatus:
      type: string
      description: P4 drives NOT_STARTED → MANAGER_REVIEW → COMPLETED → ACKNOWLEDGED; SELF_REVIEW and MEETING_SCHEDULED exist only in legacy data
      enum: [NOT_STARTED, SELF_REVIEW, MANAGER_REVIEW, MEETING_SCHEDULED, COMPLETED, ACKNOWLEDGED]
    GoalStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, DEFERRED, CANCELLED]
    GoalCategory:
      type: string
      enum: [BUSINESS, DEVELOPMENT, LEADERSHIP, INNOVATION, COMPLIANCE]
    ReviewRole:
      type: string
      enum: [EMPLOYEE, REVIEWER]
    ReviewCycle:
      type: object
      properties:
        cycleId: { type: integer, format: int64 }
        cycleName: { type: string }
        cycleYear: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        selfReviewDue: { type: string, format: date, nullable: true }
        managerReviewDue: { type: string, format: date, nullable: true }
        calibrationDue: { type: string, format: date, nullable: true }
        status: { $ref: '#/components/schemas/CycleStatus' }
        createdBy: { type: string }
        createdDate: { type: string, format: date-time }
        modifiedBy: { type: string, nullable: true }
        modifiedDate: { type: string, format: date-time, nullable: true }
    CreateReviewCycle:
      type: object
      required: [cycleName, cycleYear, startDate, endDate]
      properties:
        cycleName: { type: string, maxLength: 100 }
        cycleYear: { type: integer, minimum: 1900, maximum: 9999 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        selfReviewDue: { type: string, format: date }
        managerReviewDue: { type: string, format: date }
        calibrationDue: { type: string, format: date }
    PerformanceReview:
