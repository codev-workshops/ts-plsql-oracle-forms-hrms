# LEGACY: exchange the caller's JWT for a Forms session, then forward to the Forms servlet.
# sso_bridge.js posts {module: <lower-case wire value of $hrms_module>, clientIp: $remote_addr}
# as JSON to the internal /legacy/sso/exchange location (bearer token passed through), reads
# formsModule + otherparams from the JSON response into $forms_module / $forms_otherparams and
# redirects to @forms; 401 TOKEN_INVALID / 403 SSO_MODULE_NOT_LEGACY / 502 SSO_LEGACY_UNAVAILABLE
# are passed through to the client unchanged (ApiError body).
# DECISION P0-D1: no Oracle Forms in this phase - end-to-end exchange untested-live.
js_content sso.launch;
