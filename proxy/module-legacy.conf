# LEGACY: exchange the caller's JWT for a Forms session, then forward to the Forms servlet.
# auth_request calls the internal SSO bridge with module=$hrms_module; the bridge returns
# {sessionId, formsModule, launchUrl}; 401 TOKEN_INVALID / 403 SSO_MODULE_NOT_LEGACY / 502
# SSO_LEGACY_UNAVAILABLE are passed through to the client unchanged (ApiError body).
auth_request /legacy/sso/exchange;
auth_request_set $forms_launch $upstream_http_x_hrms_launch_url;
proxy_set_header X-HRMS-Module $hrms_module;
proxy_pass http://forms$forms_launch;
include /etc/nginx/hrms-headers.conf;
