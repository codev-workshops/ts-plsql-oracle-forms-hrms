# Dev reverse proxy: one origin (http://localhost:8000) for the whole stack.
#   /api/ -> Spring Boot backend (127.0.0.1:8080)
#   /     -> React frontend (Vite dev server, 127.0.0.1:5173)
# Run: nginx -p "$PWD" -c proxy/nginx.conf   (or use proxy/dev_proxy.py, no nginx needed)
worker_processes 1;
pid /tmp/hrms-nginx.pid;
events { worker_connections 1024; }

http {
    access_log off;
    upstream hrms_backend  { server 127.0.0.1:8080; }
    upstream hrms_frontend { server 127.0.0.1:5173; }

    server {
        listen 8000;
        server_name localhost;

        location /api/ {
            proxy_pass http://hrms_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://hrms_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
