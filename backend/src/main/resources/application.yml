spring:
  application:
    name: hrms-backend
  datasource:
    url: ${HRMS_DB_URL:jdbc:postgresql://localhost:5432/hrms}
    username: ${HRMS_DB_USER:hrms_owner}
    password: ${HRMS_DB_PASSWORD:}
  flyway:
    schemas: hrms
    default-schema: hrms
    create-schemas: true
    locations: classpath:db/migration
    placeholders:
      app_role: ${HRMS_APP_ROLE:hrms_app}

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
