spring:
  application:
    name: hrms-auth-service
  datasource:
    url: ${HRMS_PG_URL:jdbc:postgresql://localhost:5432/hrms}
    username: ${HRMS_PG_USER:hrms}
    password: ${HRMS_PG_PASSWORD:hrms}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health

hrms:
  auth:
    jwt:
      issuer: hrms
      key-id: hrms-p0
      # PKCS#8 PEM from the vault; empty = ephemeral key pair (dev/test only)
      private-key-pem: ${HRMS_JWT_PRIVATE_KEY_PEM:}
    refresh:
      ttl: 8h
    rate-limit:
      max-failures: 5
      window: 15m
    encryption:
      key-id: p0-k1
      key-base64: ${HRMS_FIELD_KEY_BASE64:}
    cookie:
      name: hrms_refresh
      path: /api/auth
      secure: true
      same-site: Strict
  proxy:
    # Frozen flag vocabulary (contracts/p0-foundation/README.md). Mirrored in proxy/nginx.conf.template.
    modules:
      auth: NEW
      employee: ${HRMS_FLAG_EMPLOYEE:LEGACY}
      payroll: ${HRMS_FLAG_PAYROLL:LEGACY}
      "[payroll.engine]": ${HRMS_FLAG_PAYROLL_ENGINE:LEGACY}
      leave: ${HRMS_FLAG_LEAVE:LEGACY}
      performance: ${HRMS_FLAG_PERFORMANCE:LEGACY}
      reporting: ${HRMS_FLAG_REPORTING:LEGACY}
  legacy:
    # Internal proxy addresses allowed to call /legacy/sso/exchange
    proxy-cidrs: ${HRMS_PROXY_CIDRS:127.0.0.1/32,::1/128,10.0.0.0/8}
    oracle:
      # Unset = SSO bridge answers 502 SSO_LEGACY_UNAVAILABLE (no Oracle in this environment)
      url: ${HRMS_ORACLE_URL:}
      username: ${HRMS_ORACLE_USER:}
      password: ${HRMS_ORACLE_PASSWORD:}

logging:
  level:
    com.acme.hrms: INFO
